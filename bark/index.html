<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bark — Job Tracker &amp; AI Evaluator</title>
<link rel="icon" type="image/svg+xml" href="assets/bark-icon.svg" />
<meta name="description" content="Paste a job listing, get an instant AI match score, salary target, and career-move read — then track the whole pipeline in one dashboard." />
<meta property="og:title" content="Bark — Job Tracker & AI Evaluator" />
<meta property="og:description" content="Scrape job listings, score your fit, and track your pipeline — a bold, high-contrast job search dashboard." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#111111;
    --cream:#FBF3E3;
    --cream-2:#F2E9D4;
    --paper:#FFFDF8;
    --turq:#00D9C0;
    --turq-dark:#00A895;
    --purple:#6C2BD9;
    --purple-dark:#4C1D95;
    --yellow:#FFCE3D;
    --pink:#FF5C8A;
    --green:#00C853;
    --gray:#8A8A82;
    --shadow: 4px 4px 0 var(--ink);
    --shadow-sm: 2px 2px 0 var(--ink);
    --shadow-lg: 7px 7px 0 var(--ink);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    background:var(--cream);
    background-image:
      linear-gradient(var(--cream-2) 1px, transparent 1px),
      linear-gradient(90deg, var(--cream-2) 1px, transparent 1px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--yellow);color:var(--ink);}

  .mono{font-family:'JetBrains Mono',monospace;}

  /* ── layout shells ─────────────────────────── */
  .nb-shell{max-width:1180px;margin:0 auto;padding:0 1.5rem 4rem;}
  .nb-topbar{
    border-bottom:3px solid var(--ink);
    background:var(--paper);
    position:sticky; top:0; z-index:50;
  }
  .nb-topbar-inner{
    max-width:1180px;margin:0 auto;padding:0 1.5rem;
    display:flex;align-items:center;justify-content:space-between;
    height:64px; gap:1rem; flex-wrap:wrap;
  }
  .nb-logo{
    display:flex;align-items:center;gap:0.6rem;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;
    letter-spacing:-0.01em;
    text-decoration:none;
  }
  .nb-logo-mark{
    width:34px;height:34px;flex-shrink:0;
    border:2px solid var(--ink);
    display:block;
  }
  .nb-back{
    font-size:0.72rem;font-weight:700;letter-spacing:0.04em;
    color:var(--gray); text-decoration:none;
  }
  .nb-back:hover{color:var(--ink);}

  /* ── buttons ────────────────────────────────── */
  .nb-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;
    border:3px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    font-weight:700;
    font-size:0.82rem;
    letter-spacing:0.01em;
    padding:0.6rem 1.1rem;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    transition:transform 0.1s, box-shadow 0.1s;
    white-space:nowrap;
  }
  .nb-btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow);}
  .nb-btn:active{transform:translate(0,0);box-shadow:0 0 0 var(--ink);}
  .nb-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm);}
  .nb-btn-primary{background:var(--turq);}
  .nb-btn-purple{background:var(--purple);color:#fff;}
  .nb-btn-yellow{background:var(--yellow);}
  .nb-btn-pink{background:var(--pink);color:#fff;}
  .nb-btn-sm{padding:0.4rem 0.7rem;font-size:0.72rem;box-shadow:2px 2px 0 var(--ink);}
  .nb-btn-sm:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
  .nb-btn-block{width:100%;}

  /* ── tabs ───────────────────────────────────── */
  .nb-tabs{display:flex;gap:0.5rem;flex-wrap:wrap;padding:1.5rem 0 0;}
  .nb-tab{
    border:3px solid var(--ink);
    background:var(--paper);
    padding:0.55rem 1rem;
    font-weight:700;font-size:0.78rem;letter-spacing:0.02em;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
  }
  .nb-tab.active{background:var(--ink);color:var(--cream);}
  .nb-tab .count{
    display:inline-block;margin-left:0.4rem;
    background:var(--yellow);color:var(--ink);
    border:2px solid var(--ink);
    padding:0 0.35rem;font-size:0.68rem;
  }
  .nb-tab.active .count{background:var(--turq);}

  /* ── generic panel/card ─────────────────────── */
  .nb-panel{
    border:3px solid var(--ink);
    background:var(--paper);
    box-shadow:var(--shadow-lg);
    padding:1.75rem;
    margin-top:1.75rem;
  }
  .nb-panel-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:1rem;flex-wrap:wrap;
    margin-bottom:1.25rem;
    padding-bottom:1rem;
    border-bottom:3px solid var(--ink);
  }
  .nb-eyebrow{
    font-size:0.68rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--purple-dark);
  }
  .nb-title{font-size:1.5rem;font-weight:700;letter-spacing:-0.01em;}
  .nb-sub{font-size:0.85rem;color:#4a4a44;max-width:640px;}

  /* ── form elements ──────────────────────────── */
  .nb-field{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1.1rem;}
  .nb-label{font-size:0.72rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;}
  .nb-hint{font-size:0.74rem;color:var(--gray);}
  .nb-input, .nb-textarea, .nb-select{
    border:3px solid var(--ink);
    background:var(--paper);
    padding:0.65rem 0.8rem;
    font-family:inherit;font-size:0.9rem;color:var(--ink);
    width:100%;
  }
  .nb-input:focus, .nb-textarea:focus, .nb-select:focus{
    outline:none; box-shadow:var(--shadow-sm);
  }
  .nb-textarea{resize:vertical;min-height:100px;line-height:1.6;}
  .nb-row{display:flex;gap:1rem;flex-wrap:wrap;}
  .nb-row > .nb-field{flex:1;min-width:180px;}
  .nb-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;}
  .nb-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;}

  /* ── badges / pills ─────────────────────────── */
  .nb-badge{
    display:inline-flex;align-items:center;gap:0.3rem;
    border:2.5px solid var(--ink);
    padding:0.18rem 0.55rem;
    font-size:0.68rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
    background:var(--paper);
  }
  .nb-skill-pill{
    display:inline-flex;
    border:2px solid var(--ink);
    background:var(--cream-2);
    padding:0.15rem 0.5rem;
    font-size:0.72rem;font-weight:600;
  }
  .nb-skill-pill.missing{background:#FFE1E8;}
  .nb-skill-pill.matched{background:#D6FBF3;}

  /* ── score dial ─────────────────────────────── */
  .nb-score{
    width:74px;height:74px;flex-shrink:0;
    border:3px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    box-shadow:var(--shadow-sm);
  }
  .nb-score .num{font-size:1.4rem;font-weight:700;line-height:1;}
  .nb-score .num .denom{font-size:0.68rem;font-weight:700;opacity:0.65;}
  .nb-score .lbl{font-size:0.55rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;}
  .score-high{background:var(--green);}
  .score-mid{background:var(--yellow);}
  .score-low{background:#FF5C5C;}

  /* ── job cards ──────────────────────────────── */
  .job-list{display:flex;flex-direction:column;gap:1.1rem;}
  .job-card{
    border:3px solid var(--ink);
    background:var(--paper);
    box-shadow:var(--shadow);
    padding:1.4rem 1.5rem;
  }
  .job-card-top{display:flex;gap:1.1rem;align-items:flex-start;}
  .job-card-main{flex:1;min-width:0;}
  .job-title{font-size:1.1rem;font-weight:700;margin-bottom:0.2rem;}
  .job-company{
    font-size:0.85rem;font-weight:700;color:var(--purple-dark);
    margin-bottom:0.5rem;
  }
  .job-meta{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;}
  .job-actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem;align-items:center;}
  .job-desc-toggle{
    margin-top:0.9rem;padding-top:0.9rem;border-top:2px dashed var(--ink);
    font-size:0.85rem;color:#3a3a35;line-height:1.75;white-space:pre-wrap;
    max-height:220px;overflow-y:auto;
  }
  .job-analysis{
    margin-top:0.9rem;padding:0.9rem 1rem;
    background:var(--cream-2);
    border:2.5px solid var(--ink);
    font-size:0.85rem;line-height:1.7;
  }
  .job-analysis-label{font-size:0.65rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--purple-dark);margin-bottom:0.35rem;}

  .status-select{border-width:2.5px; font-weight:700; font-size:0.75rem; padding:0.4rem 0.5rem; width:auto;}
  .status-In\ Progress{background:#FFF3C4;}
  .status-Applied{background:#D6FBF3;}
  .status-Interviewing{background:#E7DBFF;}
  .status-Offer{background:#D2FFD6;}
  .status-Dead\ End{background:#FFD9D9;}

  /* ── empty state ─────────────────────────────── */
  .nb-empty{
    text-align:center;padding:3.5rem 1.5rem;
    border:3px dashed var(--ink);
  }
  .nb-empty-emoji{font-size:2.4rem;margin-bottom:0.75rem;}

  /* ── analytics ──────────────────────────────── */
  .stat-tile{
    border:3px solid var(--ink);background:var(--paper);
    padding:1.1rem 1.2rem;box-shadow:var(--shadow-sm);
  }
  .stat-tile .n{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:700;line-height:1;}
  .stat-tile .l{font-size:0.7rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--gray);margin-top:0.35rem;}
  .bar-row{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.6rem;}
  .bar-label{width:150px;flex-shrink:0;font-size:0.78rem;font-weight:700;}
  .bar-track{flex:1;height:20px;border:2.5px solid var(--ink);background:var(--cream-2);position:relative;}
  .bar-fill{height:100%;background:var(--turq);border-right:2.5px solid var(--ink);}
  .bar-count{width:34px;text-align:right;font-size:0.78rem;font-weight:700;flex-shrink:0;}

  /* ── banners / callouts ─────────────────────── */
  .nb-callout{
    border:2.5px solid var(--ink);
    padding:0.85rem 1rem;
    font-size:0.8rem;line-height:1.6;
    display:flex;gap:0.6rem;align-items:flex-start;
    margin-bottom:1.1rem;
  }
  .nb-callout-info{background:#E7F3FF;}
  .nb-callout-warn{background:#FFF3C4;}
  .nb-callout-ok{background:#D2FFD6;}
  .nb-callout-error{background:#FFD6D6;}
  .nb-callout code{background:rgba(0,0,0,0.08);padding:0.05rem 0.3rem;font-size:0.78rem;}

  /* hero */
  .hero-strip{
    border:3px solid var(--ink);
    background:var(--purple);
    color:#fff;
    padding:2rem 1.75rem;
    margin-top:1.75rem;
    display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap;
    box-shadow:var(--shadow-lg);
  }
  .hero-strip h1{font-size:1.7rem;font-weight:700;margin-bottom:0.4rem;}
  .hero-strip p{font-size:0.88rem;opacity:0.85;max-width:480px;}
  .hero-strip .accent{color:var(--yellow);}

  select.nb-select{appearance:none;background-image:linear-gradient(45deg,transparent 50%, var(--ink) 50%),linear-gradient(135deg, var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) calc(1.1em),calc(100% - 13px) calc(1.1em);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:2rem;}

  @media (max-width:720px){
    .nb-grid-2,.nb-grid-3{grid-template-columns:1fr;}
    .job-card-top{flex-direction:column;}
    .hero-strip{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef } = React;

/* ─────────────────────────────────────────────────────────────
   SKILL DICTIONARY — used both to extract skills from postings
   and to score overlap against the user's profile.
───────────────────────────────────────────────────────────── */
const SKILL_DICTIONARY = [
  "JavaScript","TypeScript","Python","Java","C++","C#","Go","Rust","Ruby","PHP","Swift","Kotlin",
  "SQL","NoSQL","React","Angular","Vue","Node.js","Next.js","Django","Flask","Spring",".NET",
  "AWS","Azure","GCP","Docker","Kubernetes","Terraform","CI/CD","Git","Linux","REST API","GraphQL",
  "Microservices","Machine Learning","Deep Learning","NLP","Data Analysis","Data Engineering","ETL",
  "Pandas","NumPy","TensorFlow","PyTorch","Excel","VBA","Tableau","Power BI","Salesforce","HubSpot",
  "SEO","SEM","Google Analytics","Content Marketing","Email Marketing","Social Media Marketing",
  "Copywriting","Project Management","Agile","Scrum","Product Management","Product Strategy",
  "UX Design","UI Design","Figma","Adobe Creative Suite","Financial Modeling","FP&A","Accounting",
  "Bookkeeping","GAAP","Forecasting","Budgeting","Variance Analysis","Risk Management","Compliance",
  "EVMS","Supply Chain","Logistics","Procurement","Inventory Management","Customer Success",
  "Account Management","Sales","B2B Sales","B2C Sales","Negotiation","Leadership",
  "Cross-functional Collaboration","Stakeholder Management","Communication","Public Speaking",
  "Spanish","French","Mandarin","HR","Recruiting","Talent Acquisition","Onboarding",
  "Employee Relations","Legal","Contract Management","Healthcare","Clinical Research","Nursing",
  "Teaching","Curriculum Development","Research","Statistics","R","MATLAB","Cybersecurity",
  "Network Administration","DevOps","QA Testing","Mobile Development","iOS","Android","Blockchain"
];

const STATUS_OPTIONS = ["In Progress","Applied","Interviewing","Dead End","Offer"];

/* ─────────────────────────────────────────────────────────────
   PERSISTENCE
───────────────────────────────────────────────────────────── */
const LS_KEYS = { jobs:"jt_jobs_v1", profile:"jt_profile_v1", settings:"jt_settings_v1", connectionStatus:"jt_conn_status_v1" };

function loadLS(key, fallback){
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch(e){ return fallback; }
}
function saveLS(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
}

const DEFAULT_PROFILE = {
  name:"", yearsExp:3, targetRoles:"", skills:[], summary:"",
  currentSalary:"", targetSalary:""
};
const DEFAULT_SETTINGS = { grokKey:"", perplexityKey:"", googleClientId:"" };

/* ─────────────────────────────────────────────────────────────
   EXTRACTION — JSON-LD (schema.org JobPosting), meta-tag
   fallback, and free-text heuristics for the manual-paste path.
───────────────────────────────────────────────────────────── */
function stripHtml(html){
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || d.innerText || "").replace(/\n{3,}/g,"\n\n").trim();
}

function extractSkillsFromText(text){
  const lower = " " + (text || "").toLowerCase() + " ";
  return SKILL_DICTIONARY.filter(skill => {
    const esc = skill.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(?:^|[^a-z0-9+#.])" + esc + "(?:$|[^a-z0-9+#.])", "i");
    return re.test(lower);
  });
}

function mapJsonLdJobPosting(jp){
  const title = jp.title || "";
  const company = (jp.hiringOrganization && jp.hiringOrganization.name) || "";
  const description = stripHtml(jp.description || "");
  let location = "";
  const loc = jp.jobLocation;
  if (loc){
    const single = Array.isArray(loc) ? loc[0] : loc;
    const addr = single && single.address;
    if (addr) location = [addr.addressLocality, addr.addressRegion, addr.addressCountry].filter(Boolean).join(", ");
  }
  let workForm = "Onsite";
  if (jp.jobLocationType === "TELECOMMUTE") workForm = "Remote";
  else if (/hybrid/i.test(description)) workForm = "Hybrid";

  let salaryMin = null, salaryMax = null, salaryCurrency = "";
  const base = jp.baseSalary && jp.baseSalary.value;
  if (base){
    salaryCurrency = jp.baseSalary.currency || "";
    salaryMin = base.minValue != null ? base.minValue : (base.value != null ? base.value : null);
    salaryMax = base.maxValue != null ? base.maxValue : (base.value != null ? base.value : null);
  }
  return {
    title, company, description, location, workForm,
    salaryMin, salaryMax, salaryCurrency,
    skills: extractSkillsFromText(description + " " + title),
    source: "json-ld"
  };
}

function extractFromHTML(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const ldScripts = Array.from(doc.querySelectorAll('script[type="application/ld+json"]'));
  for (const script of ldScripts){
    try {
      const data = JSON.parse(script.textContent);
      const candidates = Array.isArray(data) ? data : (data["@graph"] || [data]);
      const jp = candidates.find(d => d && (d["@type"] === "JobPosting" ||
        (Array.isArray(d["@type"]) && d["@type"].includes("JobPosting"))));
      if (jp) return mapJsonLdJobPosting(jp);
    } catch(e){ /* not valid JSON-LD, keep looking */ }
  }
  const metaTitle = doc.querySelector('meta[property="og:title"]');
  const metaDesc = doc.querySelector('meta[name="description"]') || doc.querySelector('meta[property="og:description"]');
  const metaSite = doc.querySelector('meta[property="og:site_name"]');
  const title = (metaTitle && metaTitle.content) || (doc.querySelector("title") && doc.querySelector("title").textContent) || "";
  const description = (metaDesc && metaDesc.content) || (doc.body ? doc.body.innerText.slice(0,4000) : "");
  const company = (metaSite && metaSite.content) || "";
  return {
    title: title.trim(), company: company.trim(), description: description.trim(),
    location:"", workForm:"", salaryMin:null, salaryMax:null, salaryCurrency:"",
    skills: extractSkillsFromText(description + " " + title),
    source: "meta-fallback"
  };
}

function parseSalaryToken(numStr, hasK){
  let n = parseFloat(String(numStr).replace(/,/g, ""));
  if (isNaN(n)) return null;
  if (hasK || n < 1000) n *= 1000;
  return Math.round(n);
}

/* ─────────────────────────────────────────────────────────────
   Manual-paste header parsing — pulls title/company/location out
   of the messy first ~15 lines of a copy-pasted LinkedIn/Indeed
   posting: UI chrome ("Save", "47 applicants", star ratings) gets
   filtered out first, then title/company/location are picked by
   scoring candidate lines rather than assuming a fixed line order,
   since LinkedIn puts company before title and Indeed puts it
   after, and both often combine them on one "Company · Location ·
   Full-time" line.
───────────────────────────────────────────────────────────── */
const NOISE_LINE = /^(apply now|easy apply|apply|save job|share job|save|share|show more|show less|show more options|skip to (main )?content|sign in|join now|see more jobs|similar jobs|people also viewed|about the job|about this job|about the team|about the role|about us|who we are|our team|the team|the role|company overview|job overview|position overview|role overview|job description|full job description|job details|report this job|overview|responsibilities|requirements|qualifications|benefits|linkedin|indeed|glassdoor|sponsored|promoted|actively hiring|new|(\d+(\.\d+)?\s*(out of 5 stars?))|★+☆*|(\d+(\.\d+)?)|(\d[\d,]*\+?\s*(applicants|people clicked apply|reviews|employees))|(posted\s.*)|(reposted\s.*)|(category\s+.+)|(job id\s+.+)|(job requisition id\s*.*)|(requisition id\s*.*)|(department\s*[:\-]\s*.+)|(reports?\s+to\s*[:\-]\s*.+)|(format\s*[:\-]\s*.+))$/i;

const JOB_TITLE_WORDS = /\b(engineer|manager|analyst|director|coordinator|specialist|developer|designer|scientist|lead|associate|consultant|representative|administrator|officer|executive|intern|architect|technician|supervisor|strategist|recruiter|accountant|counsel|attorney|nurse|teacher|instructor|planner|advisor|president|controller|producer|editor|assistant|clerk|agent|buyer)\b/i;

const COMPANY_SUFFIX = /\b(inc\.?|llc|l\.l\.c\.?|corp\.?|corporation|co\.?|ltd\.?|llp|company|group|technologies|systems|solutions|holdings|partners|labs?)\.?$/i;

const WORK_FORM_WORD = /\b(remote|hybrid|on-?site)\b/i;

const EMPLOYMENT_META = /^(full-time|part-time|contract|internship|temporary|seasonal|volunteer|entry level|associate|mid-senior level|director level|executive level)$/i;

// A bare [A-Z]{2} is too easy to satisfy by coincidence — a product/business
// unit acronym next to a comma-separated list ("Mobile, Compute, XR, ...")
// can look exactly like "City, ST" (e.g. "Compute, XR"). Requiring an actual
// US state/territory code closes that off without giving up real matches.
const US_STATE_CODE = "(?:AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC)";
const CITY_STATE_RE = new RegExp("^[A-Z][a-zA-Z.\\-]+(?:\\s[A-Z][a-zA-Z.\\-]+){0,2},\\s?" + US_STATE_CODE + "(\\s?\\d{5})?$");

// "City, Region" ("London, United Kingdom") or "City, Region, Country"
// ("Scottsdale, Arizona, United States") — spelled-out region/country names,
// as opposed to CITY_STATE_RE's 2-letter US state/territory abbreviation.
// Exported as a plain string (not anchored) so both looksLikeLocation
// (anchored ^...$) and free-text extraction (searched as a substring) can
// build the regex they each need from the same core pattern.
const CITY_REGION_CORE = "[A-Z][a-zA-Z.\\-]+(?:\\s[A-Z][a-zA-Z.\\-]+){0,2},\\s?[A-Z][a-zA-Z]+(?:\\s[A-Z][a-zA-Z]+)*(?:,\\s?[A-Z][a-zA-Z]+(?:\\s[A-Z][a-zA-Z]+)*)?";
const CITY_REGION_RE = new RegExp("^" + CITY_REGION_CORE + "$");

// Matches a single "City, ST[, zip]" or "City, Region[, Country]" occurrence
// anywhere within a longer string (unanchored) — for pulling the first real
// place out of a labeled value or descriptive sentence, as opposed to
// CITY_STATE_RE/CITY_REGION_RE which test whether an entire string is
// exactly one place with nothing else around it.
const PLACE_MATCH_CORE = "[A-Z][a-zA-Z.\\-]+(?:\\s[A-Z][a-zA-Z.\\-]+){0,2},\\s?(?:" + US_STATE_CODE + "(?:\\s?\\d{5})?|[A-Z][a-zA-Z]+(?:\\s[A-Z][a-zA-Z]+)*(?:,\\s?[A-Z][a-zA-Z]+(?:\\s[A-Z][a-zA-Z]+)*)?)";

function isNoiseLine(line){
  return !line || NOISE_LINE.test(line.trim());
}

function looksLikeLocation(segment){
  const s = segment.trim();
  if (/^remote$/i.test(s)) return true;
  if (CITY_STATE_RE.test(s)) return true;
  if (CITY_REGION_RE.test(s)) return true;
  // Require "Bay"/"Metro(politan)" immediately before "Area" — a bare
  // "<word> Area" ending is too permissive (e.g. a "Job Area:" ATS field
  // label, not a location, also ends that way).
  if (/\b(?:bay|metro(?:politan)?)\s+area$/i.test(s)) return true;
  // A multi-office posting often lists several "City, ST" locations joined by
  // semicolons on one line ("New York, NY; San Francisco, CA; ...") — treat
  // the whole line as location-shaped if every semicolon-separated part is.
  if (/;/.test(s)){
    const parts = s.split(/\s*;\s*/).filter(Boolean);
    if (parts.length > 1 && parts.every(p => CITY_STATE_RE.test(p))) return true;
  }
  return false;
}

function splitHeaderSegments(line){
  return line.split(/\s*[·•|]\s*|\s+-\s+/).map(s => s.trim()).filter(Boolean);
}

function parseFreeText(text){
  const header = text.split("\n").map(l => l.trim()).filter(l => l && !isNoiseLine(l)).slice(0, 15);

  let title = "", company = "", location = "";
  // Tracks which header line the title came from, when it's a stripped
  // fragment of that line rather than the line verbatim — the company-
  // guessing fallback below needs a real index to build its "nearby lines"
  // window from, and header.indexOf(title) can't find a fragment.
  let titleLineIdx = -1;

  // Some postings label the title explicitly ("Position: Lead Accountant,
  // Affiliates – Full Time/Exempt") — a stronger, more direct signal than
  // any scoring heuristic, so honor it before anything else runs.
  const labeledTitleIdx = header.findIndex(l => /^(position|job title|title|role)\s*[:\-]\s*\S/i.test(l));
  if (labeledTitleIdx !== -1){
    title = header[labeledTitleIdx].replace(/^(position|job title|title|role)\s*[:\-]\s*/i, "").trim();
    titleLineIdx = labeledTitleIdx;
  }

  // "Title at Company" / "Title @ Company" on one line
  for (const line of header.slice(0, 6)){
    const m = line.match(/^(.{3,90}?)\s+(?:at|@)\s+(.{2,90})$/i);
    if (m && JOB_TITLE_WORDS.test(m[1]) && !JOB_TITLE_WORDS.test(m[2])){
      title = m[1].trim();
      company = m[2].trim();
      break;
    }
  }

  // Some postings never show title/company as their own header line at all —
  // only the copied job-description body came through, and the role only
  // appears inline in the opening pitch ("As an FP&A Analyst at Array, you
  // will..."). That sentence is usually well over 100 chars, so it never
  // reaches the title-scoring pass below; catch it here first instead.
  if (!title){
    for (const line of header.slice(0, 8)){
      const m = line.match(/\bas (?:an?|our new|the new|our)\s+(.{3,70}?)\s+at\s+(.{2,60}?)[,.\n]/i);
      if (m && JOB_TITLE_WORDS.test(m[1]) && !JOB_TITLE_WORDS.test(m[2])){
        title = m[1].trim();
        company = m[2].trim();
        break;
      }
    }
  }

  // Other headerless postings instead open by describing the role itself
  // ("The Market Finance Lead is a necessary financial and strategic
  // partner...") rather than naming a company at all. Gated on the
  // captured phrase matching a job-title keyword so it doesn't fire on an
  // unrelated "The [company] is a leading..." intro sentence instead.
  if (!title){
    for (const line of header.slice(0, 8)){
      const m = line.match(/^(?:the|this)\s+(.{3,60}?)\s+is\s+(?:an?|the)\b/i);
      if (m && JOB_TITLE_WORDS.test(m[1])){
        title = m[1].trim();
        break;
      }
    }
  }

  const labeledCompany = header.find(l => /^(company|employer|organization)\s*[:\-]/i.test(l));
  if (labeledCompany) company = labeledCompany.replace(/^(company|employer|organization)\s*[:\-]\s*/i, "").trim();

  // Some ATS pages put the label completely alone on its own line ("Company:"
  // with nothing after it) and the actual value on the next line — the
  // same-line match above leaves company empty in that case, so fall back
  // to reading the very next header line as the value.
  if (!company){
    const idx = header.findIndex(l => /^(company|employer|organization)\s*[:\-]?\s*$/i.test(l));
    if (idx !== -1 && idx + 1 < header.length) company = header[idx + 1].trim();
  }

  // Some ATS exports glue the "Location" label straight onto its value with
  // no colon/hyphen at all ("Location Mountain View, California; Remote -
  // Arizona - United States; ..."), often listing several offices on one
  // line. Match that bare-space form too, and pull out just the first place
  // named rather than keeping the whole multi-location string or letting it
  // fall into the combined-line splitter below, which has no concept of a
  // location-only line and would shred it into meaningless fragments
  // ("Arizona", "United States; Atlanta, Georgia; Remote") that then look
  // like plausible company-name candidates.
  // \b after "location" matters: without it, the /i flag needed for
  // case-insensitivity also lets [A-Z] match a lowercase letter, so a bare
  // "locations" line (no value at all, its own header/label line on some
  // ATS boards) would satisfy this on its trailing "s" and get mistaken for
  // "Location" + value "s".
  const labeledLocationLine = header.find(l => /^location\b\s*[:\-]?\s*[A-Z]/i.test(l));
  if (labeledLocationLine){
    const raw = labeledLocationLine.replace(/^location\b\s*[:\-]?\s*/i, "").trim();
    const firstPlace = raw.match(new RegExp(PLACE_MATCH_CORE));
    // Trust the match only when it's right at the front of the value — a
    // real "Location: City, ST; City, ST; ..." list starts with a place
    // immediately, whereas "Onsite 4x/week (Tuesday-Friday) at an Axon Hub
    // (Seattle, San Francisco-Presidio, ...)" only *contains* city-shaped
    // text deep inside a work-schedule description that isn't the answer.
    if (firstPlace && firstPlace.index <= 2){
      location = firstPlace[0];
    } else if (WORK_FORM_WORD.test(raw) && raw.length <= 20){
      // A bare "Remote"/"Hybrid"/"Onsite" value is a legitimate location
      // stand-in even with no city attached.
      location = raw;
    }
    // Otherwise the labeled value doesn't look like a clean, trustworthy
    // place — e.g. "Onsite 4x/week (Tuesday-Friday) at an Axon Hub
    // (Seattle, San Francisco-Presidio, ...)" is describing a work
    // schedule/office-hub arrangement, not a location, and coincidentally
    // contains city-shaped text ("Seattle, San Francisco") that isn't the
    // real answer either. Leave location unset so a cleaner candidate
    // found elsewhere (often right after the title) wins instead.
  }

  // Combined "Company · Location · Full-time" style lines (skip salary lines —
  // "$110,000 - $140,000" also matches the "·/-"-separated shape but isn't one,
  // and skip the labeled Location line just handled above — it's already
  // resolved and isn't a real Company/Location/Employment-type combo line)
  for (const line of header){
    if (/\$/.test(line)) continue;
    if (line === labeledLocationLine || line === labeledCompany) continue;
    const hasBullet = /[·•]/.test(line);
    if (!hasBullet && !/\s-\s/.test(line)) continue;
    // A bare " - " (no real bullet) is a much weaker signal than "·"/"•" —
    // job titles themselves very commonly use one ("Manager, Team - Focus
    // Area"), so don't treat the line as a combined header line if it looks
    // like the title itself, or it'll get misread as Company - Location.
    if (!hasBullet && JOB_TITLE_WORDS.test(line)) continue;
    const segments = splitHeaderSegments(line);
    let locSeg = segments.find(looksLikeLocation);
    if (!locSeg){
      // A segment mentioning remote/hybrid/on-site might have a city glued on
      // ("Phoenix, AZ (On-site)") — only borrow it if there's an actual place
      // in there; a bare "Hybrid"/"Remote" segment isn't a location by itself.
      const wf = segments.find(s => WORK_FORM_WORD.test(s));
      if (wf){
        const cityMatch = wf.match(new RegExp("[A-Z][a-zA-Z.\\-]+(?:\\s[A-Z][a-zA-Z.\\-]+){0,2},\\s?" + US_STATE_CODE + "(\\s?\\d{5})?"));
        if (cityMatch) locSeg = cityMatch[0];
      }
    }
    if (locSeg && !location) location = locSeg;
    if (!company){
      const companySeg = segments.find(s =>
        s !== locSeg && s.length < 60 && !JOB_TITLE_WORDS.test(s) &&
        !looksLikeLocation(s) && !EMPLOYMENT_META.test(s) && !WORK_FORM_WORD.test(s)
      );
      if (companySeg) company = companySeg;
    }
  }

  // Score header lines to find the title: reward job-title keywords, penalize
  // company-suffix and location-shaped lines, slight preference for earlier lines
  if (!title){
    // Exclude labeled-field lines (and their value on the next line) that are
    // clearly not a title even when nothing else looks like one either — a
    // bare "Job Area:" (department/function, not the role) can otherwise
    // "win" simply by not being penalized the way a real candidate is scored.
    const titleExcluded = new Set();
    header.forEach((l, i) => {
      if (/^(company|employer|organization|job area)\s*[:\-]?\s*$/i.test(l)){
        titleExcluded.add(i);
        titleExcluded.add(i + 1);
      }
    });
    let bestScore = -Infinity, bestLine = "";
    header.forEach((line, i) => {
      if (titleExcluded.has(i) || line.length > 100 || line.length < 3) return;
      let score = -i * 0.15;
      if (JOB_TITLE_WORDS.test(line)) score += 3;
      if (COMPANY_SUFFIX.test(line)) score -= 4;
      if (looksLikeLocation(line)) score -= 4;
      if (/[.:]$/.test(line)) score -= 1;
      if (score > bestScore){ bestScore = score; bestLine = line; }
    });
    title = bestLine;
  }

  // Workday-style ATS postings (common with government/defense contractors)
  // front-load a wall of metadata fields (requisition ID, clearance level,
  // job family...) before the company name ever appears, so it can sit well
  // past the first 15 non-noise header lines the fallback below searches —
  // and the real header often has nothing but a bare "Apply" button next to
  // the title, which the weak nearby-line guess picks up as if it were the
  // company. Look for the company introducing itself directly ("GDIT is
  // seeking a Finance Lead...") anywhere in the body first, since that's a
  // much more reliable signal than guessing from line position.
  if (!company){
    // The /i flag (needed for "seeking"/"Seeking"/"SEEKING" etc.) also makes
    // [A-Z] match lowercase, so a real company name isn't guaranteed by the
    // regex alone — re-check the capture is actually capitalized in code.
    const m = text.match(/\b([A-Z][\w&.'-]{1,40})\s+is\s+(?:seeking|looking for|hiring)\s+(?:an?|our new|the new|our)?\s*(.{3,70}?)(?:\s+to\b|[,.\n])/i);
    if (m && /^[A-Z]/.test(m[1]) && JOB_TITLE_WORDS.test(m[2]) && !/^(this|it|they|we|he|she)$/i.test(m[1])){
      company = m[1].trim();
    }
  }

  // Many postings close with a boilerplate "About <Company>" section — a
  // reliable company signal even when it sits far past the header (the
  // generic "About the Team"/"About the Role"/"About Us" variants are
  // filtered out above, so this only fires on an actual company name).
  if (!company){
    const m = text.match(/^About\s+([A-Z][\w&.'-]*(?:\s[A-Z][\w&.'-]*){0,3})\s*$/m);
    if (m && !/^us$/i.test(m[1])){
      company = m[1].trim();
    }
  }

  // Other postings instead open with a "Company Overview"-style section
  // header (filtered above as noise for the header/title scoring, since
  // it's not a company name itself) — sometimes with the org's own name
  // tacked on the front ("Cardinals Organizational Summary") — whose very
  // next line typically leads with the full company name ("The Arizona
  // Cardinals Football Club is a professional football team...", "Intuit
  // is the global financial technology platform that powers..."). Look at
  // the line right after that marker directly.
  if (!company){
    const lines = text.split("\n").map(l => l.trim());
    const idx = lines.findIndex(l => /^(?:[A-Za-z]+\s+)?(?:company|organization(?:al)?|job|position|role)\s+(?:overview|summary):?$/i.test(l));
    if (idx !== -1){
      const nextLine = lines.slice(idx + 1).find(l => l);
      const m = nextLine && nextLine.match(/^([A-Z][\w&.'-]*(?:\s[A-Z][\w&.'-]*){0,5})\s+(?:is|was)\b/);
      if (m) company = m[1].trim();
    }
  }

  if (!company){
    const titleIdx = titleLineIdx !== -1 ? titleLineIdx : header.indexOf(title);
    const nearby = titleIdx === -1 ? [] :
      [...header.slice(Math.max(0, titleIdx - 2), titleIdx), ...header.slice(titleIdx + 1, titleIdx + 4)];
    company = nearby.find(l => l !== title && l.length < 70 && !JOB_TITLE_WORDS.test(l) && !looksLikeLocation(l) && !/[.:]$/.test(l)) || "";
  }

  if (!location){
    for (let i = 0; i < header.length; i++){
      const line = header[i];
      const cityState = line.match(new RegExp("([A-Z][a-zA-Z.\\-]+(?:\\s[A-Z][a-zA-Z.\\-]+){0,2}),\\s?(" + US_STATE_CODE + ")\\b"));
      if (cityState){ location = cityState[1] + ", " + cityState[2]; break; }
      // Require "Bay"/"Metro(politan)" immediately before "Area" — otherwise
      // any generic ATS "<Word> Area" label (e.g. "Job Area:", a department
      // field, not a location) satisfies "capitalized word + Area" too.
      const metro = line.match(/((?:[A-Z][a-zA-Z.\-]+(?:\s[A-Z][a-zA-Z.\-]+){0,2}\s)?(?:Bay|Metro(?:politan)?)\s+Area)\b/i);
      if (metro){ location = metro[1]; break; }
      // Spelled-out region/country, not a 2-letter code ("Scottsdale,
      // Arizona, United States", "London, United Kingdom") — "Capitalized
      // Word(s), Capitalized Word(s)" is too common a shape in ordinary
      // English (title text, a company's corporate suffix, a random
      // "Finance, Accounting" mid-sentence) to trust anywhere in the
      // document, so only look for it among the first few header lines,
      // where a real location almost always sits (right after the title).
      if (i < 4 && line.length <= 60 && !JOB_TITLE_WORDS.test(line) && !COMPANY_SUFFIX.test(line)){
        const cityRegion = line.match(new RegExp(CITY_REGION_CORE));
        if (cityRegion){ location = cityRegion[0]; break; }
      }
    }
  }

  // Optional ".00" cents suffix: "$88,000.00 - $132,000.00" is a common
  // pay-scale format (this dollar figure never needs sub-dollar precision,
  // so parseSalaryToken's parseFloat+round just discards it).
  let salaryMin = null, salaryMax = null;
  // An hourly/gig rate ("$70/hr", "$70 per hour") isn't a stable annual
  // salary — annualizing it would need assumptions about hours worked that
  // this kind of flexible/part-time posting explicitly doesn't give (and
  // parseSalaryToken's "under 1000 means it's shorthand for thousands"
  // heuristic would otherwise silently turn $70/hr into a $70,000 salary).
  // Leave it blank rather than mislabel it.
  const isHourlyRate = /\$\s?[\d,]+(?:\.\d{1,2})?\s*(?:\/\s*(?:hr|hour)\b|per\s+hour\b|hourly\b)/i.test(text);
  if (!isHourlyRate){
    const rangeMatch = text.match(/\$\s?([\d,]{2,7}(?:\.\d{1,2})?)(k)?\s*(?:-|to|–|—)\s*\$?\s?([\d,]{2,7}(?:\.\d{1,2})?)(k)?/i);
    if (rangeMatch){
      salaryMin = parseSalaryToken(rangeMatch[1], !!rangeMatch[2]);
      salaryMax = parseSalaryToken(rangeMatch[3], !!rangeMatch[4]);
    } else {
      // A trailing "+" ("$120,000+") states an open-ended floor, not a real
      // two-sided range — leave salaryMax unset so downstream logic (target
      // clamping, the salary badge) doesn't treat the floor as a hard ceiling.
      const singleMatch = text.match(/\$\s?([\d,]{2,7}(?:\.\d{1,2})?)(k)?(\+)?/i);
      if (singleMatch){
        const v = parseSalaryToken(singleMatch[1], !!singleMatch[2]);
        salaryMin = v;
        salaryMax = singleMatch[3] ? null : v;
      }
    }
  }

  let workForm = "Onsite";
  if (/\bremote\b/i.test(text)) workForm = "Remote";
  if (/\bhybrid\b/i.test(text)) workForm = "Hybrid";

  if (!location && workForm === "Remote") location = "Remote";

  return {
    title: title.slice(0, 120), company, description: text, location, workForm,
    salaryMin, salaryMax, salaryCurrency: salaryMin ? "USD" : "",
    skills: extractSkillsFromText(text),
    source: "manual-paste"
  };
}

async function fetchViaProxy(url){
  const target = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
  const res = await fetch(target);
  if (!res.ok) throw new Error("Proxy fetch failed (" + res.status + ")");
  return await res.text();
}
async function fetchDirect(url){
  const res = await fetch(url, { mode:"cors" });
  if (!res.ok) throw new Error("Fetch failed (" + res.status + ")");
  return await res.text();
}

/* ─────────────────────────────────────────────────────────────
   MATCH ENGINE — offline heuristic scorer (always available)
───────────────────────────────────────────────────────────── */
function computeMatch(profile, job){
  const profileSkills = (profile.skills || []).map(s => s.toLowerCase().trim()).filter(Boolean);
  const jobSkills = (job.skills || []).map(s => s.toLowerCase().trim());
  const matched = jobSkills.filter(s => profileSkills.some(p => p === s || p.includes(s) || s.includes(p)));
  const missing = jobSkills.filter(s => !matched.includes(s));
  const skillScore = jobSkills.length ? matched.length / jobSkills.length : 0.55;

  const reqText = ((job.description || "") + " " + (job.title || "")).toLowerCase();
  const yearsMatch = reqText.match(/(\d{1,2})\+?\s*(?:-\s*\d{1,2}\s*)?years?/);
  const requiredYears = yearsMatch ? parseInt(yearsMatch[1], 10) : null;

  let seniorityScore = 0.8;
  if (requiredYears != null){
    const diff = (Number(profile.yearsExp) || 0) - requiredYears;
    seniorityScore = diff >= 0 ? 1 : Math.max(0.15, 1 + diff / Math.max(requiredYears, 1));
  }

  const score = Math.round(Math.min(10, Math.max(1, skillScore * 6.8 + seniorityScore * 3.2)));
  return {
    score,
    matched: [...new Set(matched)],
    missing: [...new Set(missing)],
    requiredYears
  };
}

/* ─────────────────────────────────────────────────────────────
   COMPARABLE COMPENSATION BENCHMARK — when a listing doesn't
   disclose salary, estimate a market range for similar roles in
   the same family so there's still a defensible number to open
   with on an intro/welcome call. Always available offline;
   refined by the AI tiers below when a Grok or Perplexity key is
   configured.
───────────────────────────────────────────────────────────── */
const SALARY_BENCHMARKS = [
  { id:"software", label:"Software Engineering", match:/software engineer|\bswe\b|back.?end|front.?end|full.?stack|developer|programmer|site reliability|devops|mobile engineer|ios engineer|android engineer/i, low:105000, high:150000 },
  { id:"data", label:"Data & ML", match:/data scientist|data engineer|data analyst|machine learning|\bml engineer\b|analytics engineer/i, low:100000, high:145000 },
  { id:"product", label:"Product Management", match:/product manager|product owner/i, low:115000, high:155000 },
  { id:"design", label:"Design", match:/\bux\b|\bui\b designer|product designer|graphic designer|visual designer/i, low:90000, high:125000 },
  { id:"finance", label:"Finance & Accounting", match:/financial analyst|fp\s*&\s*a|finance manager|accountant|controller|treasury|investment analyst/i, low:75000, high:110000 },
  { id:"marketing", label:"Marketing", match:/marketing manager|content marketing|\bseo\b|growth marketing|brand manager|marketing specialist|demand generation/i, low:65000, high:100000 },
  { id:"sales", label:"Sales", match:/account executive|sales representative|sales manager|business development|\bbdr\b|\bsdr\b/i, low:70000, high:115000 },
  { id:"hr", label:"HR & Talent", match:/recruiter|talent acquisition|hr generalist|human resources|people operations/i, low:65000, high:95000 },
  { id:"operations", label:"Operations & Supply Chain", match:/operations manager|supply chain|logistics|procurement/i, low:70000, high:105000 },
  { id:"project", label:"Project & Program Management", match:/project manager|program manager|scrum master/i, low:80000, high:120000 },
  { id:"success", label:"Customer Success", match:/customer success|client success|account manager/i, low:65000, high:98000 },
  { id:"legal", label:"Legal & Compliance", match:/paralegal|attorney|counsel|compliance officer/i, low:85000, high:145000 },
  { id:"healthcare", label:"Healthcare", match:/registered nurse|\brn\b|nurse practitioner|clinical/i, low:75000, high:112000 },
  { id:"education", label:"Education", match:/teacher|instructor|curriculum/i, low:48000, high:75000 },
  { id:"engineering", label:"Engineering (non-software)", match:/mechanical engineer|civil engineer|electrical engineer|chemical engineer/i, low:80000, high:118000 },
  { id:"admin", label:"Administrative", match:/administrative assistant|office manager|coordinator/i, low:45000, high:65000 }
];
const DEFAULT_BENCHMARK = { id:"general", label:"General Professional", low:60000, high:92000 };

const SENIORITY_MULTIPLIERS = [
  { match:/\bintern\b/i, mult:0.42, label:"Intern" },
  { match:/\bchief\b|\bc[a-z]o\b/i, mult:2.5, label:"Executive" },
  { match:/\bvp\b|vice president/i, mult:2.05, label:"VP" },
  { match:/\bdirector\b|head of/i, mult:1.65, label:"Director" },
  { match:/\bstaff\b|\bprincipal\b/i, mult:1.5, label:"Staff/Principal" },
  { match:/\blead\b/i, mult:1.4, label:"Lead" },
  { match:/\bsenior\b|\bsr\.?\s/i, mult:1.25, label:"Senior" },
  { match:/\bjunior\b|\bentry.level\b/i, mult:0.8, label:"Junior/Entry" }
];

function experienceMultiplier(years){
  const y = Number(years) || 0;
  if (y < 2) return 0.85;
  if (y < 5) return 1.0;
  if (y < 8) return 1.15;
  if (y < 12) return 1.35;
  return 1.6;
}

function estimateComparableSalary(job, profile){
  const text = (job.title || "") + " " + (job.description || "").slice(0, 800);
  const family = SALARY_BENCHMARKS.find(b => b.match.test(text)) || DEFAULT_BENCHMARK;
  const seniorityHit = SENIORITY_MULTIPLIERS.find(s => s.match.test(job.title || ""));
  const multiplier = seniorityHit ? seniorityHit.mult : experienceMultiplier(profile.yearsExp);
  const level = seniorityHit ? seniorityHit.label : (Number(profile.yearsExp) >= 8 ? "Senior" : Number(profile.yearsExp) >= 3 ? "Mid" : "Early Career");
  return {
    low: Math.round((family.low * multiplier) / 1000) * 1000,
    high: Math.round((family.high * multiplier) / 1000) * 1000,
    family: family.label,
    level,
    source: "benchmark"
  };
}

function computeSalaryTarget(profile, job, matchResult, comparable){
  const profileTarget = Number(profile.targetSalary) || (Number(profile.currentSalary) ? Number(profile.currentSalary) * 1.15 : null);
  const hasMin = job.salaryMin != null && job.salaryMin !== "";
  const hasMax = job.salaryMax != null && job.salaryMax !== "";
  // A real two-sided range (min < max) is a hard ceiling worth respecting —
  // recommending an ask above the employer's own advertised top undermines
  // the advice. An open-ended floor ("$120,000+", hasMin but no hasMax) has
  // no ceiling by definition, so it's excluded from that treatment.
  const isRealRange = hasMin && hasMax && Number(job.salaryMax) > Number(job.salaryMin);
  const isOpenFloor = hasMin && !hasMax;

  let base = null;
  let source = "listing";
  if (hasMin && hasMax) base = (Number(job.salaryMin) + Number(job.salaryMax)) / 2;
  else if (hasMax) base = Number(job.salaryMax);
  else if (hasMin) base = Number(job.salaryMin);
  else if (comparable && comparable.low && comparable.high){
    base = (comparable.low + comparable.high) / 2;
    source = "comparable";
  } else if (profileTarget){
    base = profileTarget;
    source = "profile";
  }

  if (!base){
    return { recommendation:null, low:null, high:null, note:"No salary was listed and no target salary is set on your profile — add one for a recommendation.", source:"none" };
  }
  const matchMultiplier = 0.9 + (matchResult.score / 10) * 0.2;
  let target = Math.round((base * matchMultiplier) / 500) * 500;
  if (profileTarget && target < profileTarget * 0.9) target = Math.round((profileTarget * 0.95) / 500) * 500;

  // Clamp the ask to whatever range we're citing as the anchor — a stated
  // employer range, or (when nothing was posted) the comparable-roles band
  // shown alongside it. An open floor has no ceiling to clamp against, but
  // it's still a floor — a weak fit score should never push the ask below
  // the minimum the employer already committed to paying.
  if (isRealRange){
    target = Math.min(Math.max(target, Number(job.salaryMin)), Number(job.salaryMax));
  } else if (isOpenFloor){
    target = Math.max(target, Number(job.salaryMin));
  } else if (source === "comparable"){
    target = Math.min(Math.max(target, comparable.low), comparable.high);
  }

  if (source === "comparable"){
    return {
      recommendation: target,
      low: comparable.low,
      high: comparable.high,
      note: "No salary was listed — benchmarked against comparable " + comparable.family + " (" + comparable.level + ") roles" + (comparable.source === "grok" ? ", refined by Grok." : "."),
      source
    };
  }
  if (isRealRange){
    return {
      recommendation: target,
      low: Number(job.salaryMin),
      high: Number(job.salaryMax),
      note: "Based on the posted range, adjusted for your fit score.",
      source
    };
  }
  if (isOpenFloor){
    return {
      recommendation: target,
      low: Number(job.salaryMin),
      high: null,
      note: "Posting lists an open-ended floor (" + fmtMoney(job.salaryMin) + "+) rather than a capped range, so your ask can go above it.",
      source
    };
  }
  return {
    recommendation: target,
    low: Math.round((target * 0.93) / 500) * 500,
    high: Math.round((target * 1.08) / 500) * 500,
    note: source === "listing" ? "Based on the posted range, adjusted for your fit score." : "Posting had no salary listed — estimated from your profile target.",
    source
  };
}

function generateCareerAnalysis(profile, job, matchResult, salaryTarget){
  const strengths = matchResult.matched.slice(0,3).join(", ");
  const gaps = matchResult.missing.slice(0,3).join(", ");

  // Distinguish *why* a role scores below "strong" — a seniority/scope gap on
  // top of solid skill overlap is a legitimate reach worth pursuing, while a
  // gap concentrated in core skills is a real mismatch. This only changes the
  // narrative below; matchResult.score itself is never touched.
  const totalSkills = matchResult.matched.length + matchResult.missing.length;
  const missingRatio = totalSkills ? matchResult.missing.length / totalSkills : 0;
  const yearsGap = matchResult.requiredYears != null ? matchResult.requiredYears - (Number(profile.yearsExp) || 0) : 0;
  const isSeniorityStretch = matchResult.score < 8 && missingRatio <= 0.35 && yearsGap > 0;
  const isCoreSkillGap = matchResult.score < 8 && missingRatio > 0.35;

  let verdict, s2;
  if (matchResult.score >= 8){
    verdict = "a strong alignment with your background";
    s2 = gaps ? "The clearest gap is " + gaps + " — minor, and worth addressing directly in a cover letter or interview." : "Your listed skills cover the stated requirements well.";
  } else if (isSeniorityStretch){
    verdict = "a healthy stretch toward the next level — your core skills line up well, and the gap is mostly seniority or scope rather than ability";
    s2 = gaps
      ? "The gap on paper (" + gaps + ") reads more like experience depth than a missing skill — worth reaching for, and worth naming directly as growth-in-progress in a cover letter or interview."
      : "Your core skills line up well; the main gap is years of experience or scope, not ability.";
  } else if (isCoreSkillGap){
    verdict = matchResult.score >= 4 ? "a real stretch, with gaps in core requirements rather than just seniority" : "a significant reach, with real gaps in core requirements";
    s2 = gaps ? "The clearest gaps are " + gaps + " — these are foundational to the role, so treat this as a genuine skills mismatch rather than a seniority reach." : "Your listed skills cover the stated requirements well.";
  } else {
    verdict = matchResult.score >= 4 ? "a reasonable stretch from your current experience" : "a significant reach given what's listed";
    s2 = gaps ? "The clearest gap is " + gaps + " — worth addressing directly in a cover letter or interview." : "Your listed skills cover the stated requirements well.";
  }

  const s1 = "This role looks like " + verdict + (strengths ? ", particularly given your experience with " + strengths + "." : ".");
  let s3;
  if (salaryTarget.recommendation && salaryTarget.source === "comparable"){
    s3 = "Salary wasn't posted, so use $" + salaryTarget.low.toLocaleString() + "–$" + salaryTarget.high.toLocaleString() +
      " (comparable roles) as your anchor on an intro or welcome call, with $" + salaryTarget.recommendation.toLocaleString() + " as your opening ask.";
  } else if (salaryTarget.recommendation){
    s3 = "Target roughly $" + salaryTarget.recommendation.toLocaleString() + " in negotiations — " + salaryTarget.note.toLowerCase();
  } else {
    s3 = salaryTarget.note;
  }
  return s1 + " " + s2 + " " + s3;
}

/* ─────────────────────────────────────────────────────────────
   AI-ENHANCED EVALUATION — Grok (xAI). Optional, only runs if the
   user has supplied their own Grok key in Settings. Falls back to
   the offline heuristic above on any error. xAI's chat completions
   endpoint is OpenAI-compatible, so this is the same request/
   response shape as the match-scoring calls in the architecture
   doc's production plan — just a different base URL and model.
───────────────────────────────────────────────────────────── */
const GROK_MODEL = "grok-4-fast";

const MATCH_SYSTEM_PROMPT = "You are a career-matching engine inside a personal job application tracker. " +
  "Given a candidate's background and a single job posting, evaluate fit with rigor and honesty — do not " +
  "inflate scores to be encouraging, and call out real gaps. Score matchScore on a 1-10 integer scale where " +
  "10 is a perfect match and 1 is a poor match — never use a 0-100 scale. A role does not have to be a near-" +
  "perfect match to be worth pursuing: when the score is below 8, look at WHERE the gap actually is. If the " +
  "candidate's core skills line up well and the shortfall is mainly seniority, years of experience, or scope " +
  "(a role reaching toward their next career level), say so explicitly in the analysis and frame it as a " +
  "legitimate, worthwhile stretch — not a warning sign. If instead the gap is concentrated in core skills the " +
  "role actually requires, say so explicitly too and be direct that it's a real mismatch rather than a " +
  "seniority reach. Do not change the numeric score based on this distinction — it only affects how you " +
  "describe the gap in the analysis text. When the posting states a real, capped salary range (a distinct low " +
  "and high), keep salaryTarget within that range — recommending an ask above the employer's own advertised " +
  "ceiling undermines the advice. When the posting only states an open-ended floor (e.g. \"$120,000+\", no " +
  "distinct high end), there is no ceiling to respect and salaryTarget may exceed it. When the posting does " +
  "not disclose a salary at all, estimate a realistic market compensation range for comparable roles (same " +
  "title/family, similar seniority, industry, and location) from your general knowledge, and keep salaryTarget " +
  "within that estimated range for the same reason — this is an estimate for the candidate to use as an anchor " +
  "in an intro or welcome call, not a live quote, so say so plainly in the analysis and give a specific opening " +
  "number. Respond with ONLY a JSON object matching this exact schema, no prose outside it: " +
  '{"matchScore": number 1-10 (integer), "salaryTarget": number|null, "salaryRangeLow": number|null, ' +
  '"salaryRangeHigh": number|null, "comparableSalaryLow": number|null, "comparableSalaryHigh": number|null, ' +
  '"comparableContext": string|null (short phrase, e.g. "mid-level Product Manager roles in tech"), ' +
  '"analysis": string (2-3 sentences), "matchedSkills": string[], "missingSkills": string[]}';

function buildMatchPrompt(profile, job){
  const lines = [
    "CANDIDATE BACKGROUND",
    "Years of experience: " + (profile.yearsExp || "n/a"),
    "Skills: " + ((profile.skills || []).join(", ") || "n/a"),
    "Target roles: " + (profile.targetRoles || "n/a"),
    "Current salary: " + (profile.currentSalary || "not specified"),
    "Target salary: " + (profile.targetSalary || "not specified"),
    "Summary: " + (profile.summary || "n/a"),
    "",
    "JOB POSTING",
    "Title: " + job.title,
    "Company: " + job.company,
    "Location: " + (job.location || "n/a"),
    "Work form: " + (job.workForm || "n/a"),
    "Stated salary: " + (job.salaryMin && job.salaryMax
      ? job.salaryMin + " - " + job.salaryMax + " " + (job.salaryCurrency || "") + " (a real capped range — do not recommend an ask above the top of it)"
      : job.salaryMin
      ? job.salaryMin + "+ " + (job.salaryCurrency || "") + " (an open-ended floor, not a capped range — an ask above this is fine)"
      : "not disclosed")
  ];
  if (!job.salaryMin && !job.salaryMax){
    const bench = estimateComparableSalary(job, profile);
    lines.push("Rough offline benchmark for reference (refine with your own knowledge if you can do better): $" +
      bench.low.toLocaleString() + " - $" + bench.high.toLocaleString() + " for " + bench.family + " (" + bench.level + " level)");
  }
  lines.push("Description:", (job.description || "").slice(0, 6000), "", "Evaluate the match and return the JSON object only.");
  return lines.join("\n");
}

async function callGrokEvaluate(apiKey, profile, job){
  const res = await fetch("https://api.x.ai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization":"Bearer " + apiKey },
    body: JSON.stringify({
      model: GROK_MODEL,
      response_format: { type: "json_object" },
      temperature: 0.4,
      messages: [
        { role:"system", content: MATCH_SYSTEM_PROMPT },
        { role:"user", content: buildMatchPrompt(profile, job) }
      ]
    })
  });
  if (!res.ok) throw new Error("Grok request failed (" + res.status + ")");
  const data = await res.json();
  return JSON.parse(data.choices[0].message.content);
}

/* ─────────────────────────────────────────────────────────────
   LIVE SALARY BENCHMARK — Perplexity (Sonar), which has web search
   grounding built into the model rather than bolted on as a tool.
   Optional, only runs if the user has supplied their own
   Perplexity key in Settings and the listing has no stated salary.
   One call: Sonar reasons over live search results directly, so
   there's no separate extraction pass first. Falls back to the
   offline/Grok comparable estimate on any error. Returns real
   source citations, which get surfaced in the UI — actual links
   beat a vague "estimated" sentence when you're prepping for a
   call.
───────────────────────────────────────────────────────────── */
const PERPLEXITY_MODEL = "sonar";

function extractJsonObject(text){
  try { return JSON.parse(text); } catch(e){}
  const match = text.match(/\{[\s\S]*\}/);
  if (match){
    try { return JSON.parse(match[0]); } catch(e){}
  }
  throw new Error("Could not parse JSON from response");
}

async function callPerplexity(apiKey, prompt){
  const res = await fetch("https://api.perplexity.ai/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
    body: JSON.stringify({
      model: PERPLEXITY_MODEL,
      messages: [
        { role: "system", content: "Respond with ONLY a single strict JSON object — no prose, no markdown code fences, nothing outside the JSON." },
        { role: "user", content: prompt }
      ]
    })
  });
  if (!res.ok) throw new Error("Perplexity request failed (" + res.status + ")");
  const data = await res.json();
  const text = data?.choices?.[0]?.message?.content;
  if (!text) throw new Error("Perplexity returned no content");
  const citations = data.citations || (data.search_results || []).map(r => r.url).filter(Boolean);
  return { ...extractJsonObject(text), citations };
}

async function fetchSalaryBenchmark(apiKey, job){
  const prompt = `Research current market compensation for this job posting. Identify the standardized role (title, industry, seniority level, location), search for live compensation data on comparable roles, then return ONLY a strict JSON object with this exact shape:
{
  "clean_title": string,
  "industry": string,
  "experience_level": string,
  "location": string | null,
  "min_salary": number,
  "median_salary": number,
  "max_salary": number,
  "confidence_score": "low" | "medium" | "high",
  "rationale": "short explanation of the market data found"
}

JOB POSTING
Title: ${job.title}
Company: ${job.company}
Location: ${job.location || "unknown"}
Description:
${(job.description || "").slice(0, 4000)}`;
  return callPerplexity(apiKey, prompt);
}

function isUsableLiveBenchmark(live){
  if (!live || live.confidence_score === "low") return false;
  const { min_salary, max_salary } = live;
  return typeof min_salary === "number" && typeof max_salary === "number" &&
    min_salary > 0 && max_salary >= min_salary;
}

/* ─────────────────────────────────────────────────────────────
   API CONNECTION TESTS — lightweight, on-demand checks the
   Settings tab uses so a bad/expired/rate-limited key surfaces
   immediately with the real provider error, instead of only
   showing up later as a silent fallback to the offline heuristic
   the next time a job is evaluated.
───────────────────────────────────────────────────────────── */
async function extractApiErrorMessage(res){
  const body = await res.text().catch(() => "");
  try {
    const j = JSON.parse(body);
    if (j.error && j.error.message) return j.error.message;
    if (j.error && typeof j.error === "string") return j.error;
    if (j.message) return j.message;
  } catch(e){ /* not JSON, fall through */ }
  return "HTTP " + res.status;
}

async function testGrokConnection(apiKey){
  try {
    const res = await fetch("https://api.x.ai/v1/models", {
      headers: { "Authorization": "Bearer " + apiKey }
    });
    if (res.ok) return { ok: true };
    return { ok: false, message: await extractApiErrorMessage(res) };
  } catch(e){
    return { ok: false, message: e.message || "Network error" };
  }
}

async function testPerplexityConnection(apiKey){
  try {
    const res = await fetch("https://api.perplexity.ai/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
      body: JSON.stringify({ model: PERPLEXITY_MODEL, messages: [{ role: "user", content: "Reply with only the word: ok" }], max_tokens: 5 })
    });
    if (res.ok) return { ok: true };
    return { ok: false, message: await extractApiErrorMessage(res) };
  } catch(e){
    return { ok: false, message: e.message || "Network error" };
  }
}

/* ─────────────────────────────────────────────────────────────
   SHARED EVALUATION PIPELINE — runs the full offline/Perplexity/
   Grok pipeline against a job + the current profile. Used both
   when a job is first saved and when it's re-scored later (the
   "Refresh" action) after the profile changes — same fields, same
   fallback behavior, one place to maintain it.
───────────────────────────────────────────────────────────── */
async function evaluateJob(job, profile, settings){
  const hasStatedSalary = !!(job.salaryMin || job.salaryMax);
  let comparable = hasStatedSalary ? null : estimateComparableSalary(job, profile);
  const notes = [];

  if (!hasStatedSalary && settings.perplexityKey){
    try {
      const live = await fetchSalaryBenchmark(settings.perplexityKey, job);
      if (!isUsableLiveBenchmark(live)){
        console.warn("Perplexity salary benchmark skipped (low confidence or unusable numbers) — using the offline estimate instead.", live);
      } else {
        comparable = {
          low: live.min_salary,
          high: live.max_salary,
          median: live.median_salary || null,
          family: live.clean_title || comparable.family,
          level: live.experience_level || comparable.level,
          confidence: live.confidence_score || null,
          rationale: live.rationale || null,
          citations: live.citations || [],
          source: "perplexity-live"
        };
      }
    } catch(e){
      console.warn("Perplexity salary benchmark failed — using the offline estimate instead.", e);
    }
  }

  let matchResult = computeMatch(profile, job);
  let salaryTarget = computeSalaryTarget(profile, job, matchResult, comparable);
  let analysis = generateCareerAnalysis(profile, job, matchResult, salaryTarget);
  let engineUsed = "Offline heuristic engine";

  if (settings.grokKey){
    try {
      const ai = await callGrokEvaluate(settings.grokKey, profile, job);
      matchResult = {
        score: ai.matchScore,
        matched: ai.matchedSkills || [],
        missing: ai.missingSkills || [],
        requiredYears: matchResult.requiredYears
      };
      if (hasStatedSalary){
        // Grok generates its own salaryTarget/salaryRangeLow/High from the
        // prompt, so it can (rarely) ignore the "don't exceed a real range"
        // instruction — clamp it here the same way the offline path does,
        // rather than trusting the model to always honor the guardrail.
        const hasMin = job.salaryMin != null && job.salaryMin !== "";
        const hasMax = job.salaryMax != null && job.salaryMax !== "";
        const isRealRange = hasMin && hasMax && Number(job.salaryMax) > Number(job.salaryMin);
        const isOpenFloor = hasMin && !hasMax;
        let target = Number(ai.salaryTarget);
        if (isRealRange && Number.isFinite(target)){
          target = Math.min(Math.max(target, Number(job.salaryMin)), Number(job.salaryMax));
        } else if (isOpenFloor && Number.isFinite(target)){
          target = Math.max(target, Number(job.salaryMin));
        }
        salaryTarget = {
          recommendation: Number.isFinite(target) ? target : ai.salaryTarget,
          low: isRealRange || isOpenFloor ? Number(job.salaryMin) : ai.salaryRangeLow,
          high: isRealRange ? Number(job.salaryMax) : (isOpenFloor ? null : ai.salaryRangeHigh),
          note: "Generated by Grok (" + GROK_MODEL + ").",
          source: "listing"
        };
      } else {
        if (comparable.source === "benchmark" && ai.comparableSalaryLow && ai.comparableSalaryHigh){
          comparable = { low: ai.comparableSalaryLow, high: ai.comparableSalaryHigh, family: ai.comparableContext || comparable.family, level: comparable.level, source: "grok" };
        }
        salaryTarget = computeSalaryTarget(profile, job, matchResult, comparable);
      }
      analysis = ai.analysis + (!hasStatedSalary && comparable && comparable.rationale ? " " + comparable.rationale : "");
      engineUsed = "Grok (" + GROK_MODEL + ")";
    } catch(e){
      notes.push("AI evaluation failed (" + e.message + ") — used the offline heuristic engine instead.");
    }
  }

  const fields = {
    matchScore: matchResult.score,
    matchedSkills: matchResult.matched,
    missingSkills: matchResult.missing,
    salaryTarget: salaryTarget.recommendation,
    salaryTargetLow: salaryTarget.low,
    salaryTargetHigh: salaryTarget.high,
    comparableSalaryLow: comparable ? comparable.low : null,
    comparableSalaryHigh: comparable ? comparable.high : null,
    comparableMedian: comparable ? (comparable.median || null) : null,
    comparableFamily: comparable ? comparable.family : null,
    comparableConfidence: comparable ? (comparable.confidence || null) : null,
    comparableRationale: comparable ? (comparable.rationale || null) : null,
    comparableCitations: comparable ? (comparable.citations || []) : [],
    comparableSource: comparable ? comparable.source : null,
    careerAnalysis: analysis,
    evalEngine: engineUsed,
    lastEvaluatedAt: new Date().toISOString()
  };

  return { fields, notes };
}

/* ─────────────────────────────────────────────────────────────
   EXPORT — CSV (fully client-side) and Google Sheets (OAuth
   token flow via Google Identity Services, no backend needed)
───────────────────────────────────────────────────────────── */
function csvEscape(v){
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function triggerDownload(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(jobs){
  const headers = ["Title","Company","Location","Work Form","Status","Match Score","Salary Min","Salary Max","Comparable Low","Comparable High","Comparable Source","Comparable Confidence","Salary Target","URL","Date Added"];
  const rows = jobs.map(j => [
    j.title, j.company, j.location, j.workForm, j.status, j.matchScore,
    j.salaryMin || "", j.salaryMax || "", j.comparableSalaryLow || "", j.comparableSalaryHigh || "", j.comparableSource || "", j.comparableConfidence || "", j.salaryTarget || "", j.url || "", j.dateAdded
  ]);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(",")).join("\n");
  triggerDownload("bark-export.csv", csv, "text/csv");
}

function ensureGoogleIdentity(){
  return new Promise((resolve, reject) => {
    if (window.google && window.google.accounts) return resolve();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Failed to load Google Identity Services"));
    document.head.appendChild(s);
  });
}
async function exportToGoogleSheets(jobs, clientId){
  await ensureGoogleIdentity();
  return new Promise((resolve, reject) => {
    const tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: "https://www.googleapis.com/auth/spreadsheets",
      callback: async (resp) => {
        if (resp.error) return reject(new Error(resp.error));
        try {
          const token = resp.access_token;
          const createRes = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
            method:"POST",
            headers:{ Authorization:"Bearer " + token, "Content-Type":"application/json" },
            body: JSON.stringify({ properties:{ title:"Bark Export " + new Date().toLocaleDateString() } })
          });
          const sheet = await createRes.json();
          if (!sheet.spreadsheetId) throw new Error("Sheets API did not return a spreadsheet id");
          const values = [
            ["Title","Company","Location","Work Form","Status","Match Score","Salary Min","Salary Max","Comparable Low","Comparable High","Comparable Source","Comparable Confidence","Salary Target","URL","Date Added"],
            ...jobs.map(j => [j.title, j.company, j.location, j.workForm, j.status, j.matchScore, j.salaryMin || "", j.salaryMax || "", j.comparableSalaryLow || "", j.comparableSalaryHigh || "", j.comparableSource || "", j.comparableConfidence || "", j.salaryTarget || "", j.url || "", j.dateAdded])
          ];
          await fetch("https://sheets.googleapis.com/v4/spreadsheets/" + sheet.spreadsheetId + "/values/Sheet1!A1:append?valueInputOption=USER_ENTERED", {
            method:"POST",
            headers:{ Authorization:"Bearer " + token, "Content-Type":"application/json" },
            body: JSON.stringify({ values })
          });
          window.open(sheet.spreadsheetUrl, "_blank");
          resolve(sheet.spreadsheetUrl);
        } catch(e){ reject(e); }
      }
    });
    tokenClient.requestAccessToken();
  });
}

/* ─────────────────────────────────────────────────────────────
   RESUME / LINKEDIN PDF IMPORT — extracts text from an uploaded
   PDF (resume or a LinkedIn "Save to PDF" profile export) via
   PDF.js, then builds a profile draft from it: an offline
   heuristic pass (skill-dictionary matching + years-worked from
   date ranges) always runs, refined by Grok when a key is set —
   same two-tier pattern as job evaluation and salary benchmarking.
───────────────────────────────────────────────────────────── */
async function ensurePdfJs(){
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error("Failed to load PDF.js"));
    document.head.appendChild(s);
  });
}

async function extractPdfText(file){
  const pdfjsLib = await ensurePdfJs();
  const buffer = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buffer }).promise;
  let text = "";
  for (let i = 1; i <= doc.numPages; i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    // Reconstruct line breaks from each item's vertical position — PDF.js's raw
    // item order has no concept of lines, and a naive join(" ") collapses a
    // LinkedIn export's one-skill-per-line sidebar into a single unsplittable
    // blob. Comparing the Y coordinate (transform[5]) between consecutive
    // items is the standard way to tell "same line" from "new line".
    let lastY = null;
    content.items.forEach(item => {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 1){
        text += "\n";
      } else if (text && !/[\n ]$/.test(text)){
        text += " ";
      }
      text += item.str;
      lastY = y;
    });
    text += "\n\n";
  }
  return text;
}

/* ─────────────────────────────────────────────────────────────
   Section-aware parsing for the offline heuristic. LinkedIn's
   "Save to PDF" export (and most resumes) use a small fixed set
   of section headers, each on its own line — reading those
   directly beats blind skill-dictionary matching against the
   whole document, and matters most for two things dictionary
   matching can't do at all: catching self-reported skills that
   aren't in a ~100-word dictionary ("Earned Value Management
   (EVM)", "Organization Skills"), and not letting Education dates
   pollute a years-of-experience estimate meant to only cover
   Experience.
───────────────────────────────────────────────────────────── */
const RESUME_SECTION_HEADERS = [
  "Summary", "About", "Experience", "Work Experience", "Education", "Top Skills", "Skills",
  "Certifications", "Licenses & Certifications", "Languages", "Honors-Awards", "Honors & Awards",
  "Publications", "Volunteering", "Volunteer Experience", "Projects", "Courses", "Organizations",
  "Patents", "Contact"
];

function sliceResumeSection(text, name){
  const lines = text.split("\n").map(l => l.trim());
  const startIdx = lines.findIndex(l => l === name);
  if (startIdx === -1) return "";
  let endIdx = lines.length;
  for (let i = startIdx + 1; i < lines.length; i++){
    if (lines[i] !== name && RESUME_SECTION_HEADERS.includes(lines[i])){ endIdx = i; break; }
  }
  return lines.slice(startIdx + 1, endIdx).filter(Boolean).join("\n");
}

function findResumeSection(text, candidateNames){
  for (const name of candidateNames){
    const section = sliceResumeSection(text, name);
    if (section) return section;
  }
  return "";
}

function estimateYearsFromResumeText(text){
  const experienceText = findResumeSection(text, ["Experience", "Work Experience"]) || text;
  const now = new Date().getFullYear();
  // "September 2025 - Present", "November 2024 - September 2025", or bare "2016 - 2019" —
  // LinkedIn/resumes almost always name the month on both ends of a range, not just the year,
  // so the end side needs an optional month word before the year/present/current token.
  const rangeRe = /((?:19|20)\d{2})\s*(?:-|–|—|to)\s*(?:[A-Za-z]+\.?\s+)?((?:19|20)\d{2}|present|current)/gi;
  let earliest = null, latest = null, m;
  while ((m = rangeRe.exec(experienceText))){
    const start = parseInt(m[1], 10);
    const end = /present|current/i.test(m[2]) ? now : parseInt(m[2], 10);
    if (earliest === null || start < earliest) earliest = start;
    if (latest === null || end > latest) latest = end;
  }
  if (earliest === null) return null;
  return Math.max(0, Math.min(now - earliest, 45));
}

function splitSkillEntries(sectionText){
  // LinkedIn lists one skill per line; plain resumes often cram a whole
  // "Skills: A, B, C" list onto one line instead — split on both so either
  // format ends up as clean individual entries rather than one opaque blob.
  return sectionText.split("\n")
    .flatMap(line => line.split(/,|;|•/))
    .map(s => s.trim())
    .filter(Boolean);
}

function parseResumeTextOffline(text){
  const topSkills = splitSkillEntries(findResumeSection(text, ["Top Skills", "Skills"]));
  const certSkills = splitSkillEntries(findResumeSection(text, ["Certifications", "Licenses & Certifications"]));
  const merged = [...topSkills, ...certSkills];
  extractSkillsFromText(text).forEach(s => {
    if (!merged.some(m => m.toLowerCase() === s.toLowerCase())) merged.push(s);
  });

  const rawSummary = findResumeSection(text, ["Summary", "About"]).replace(/\s*\n\s*/g, " ").trim();
  const summary = rawSummary.length > 500 ? rawSummary.slice(0, 500).trim() + "…" : rawSummary;

  return {
    skills: merged,
    yearsExp: estimateYearsFromResumeText(text),
    targetRoles: "",
    summary,
    source: "offline-heuristic"
  };
}

const RESUME_SYSTEM_PROMPT = "You are extracting a structured professional profile from a resume or LinkedIn " +
  "profile export, for use in a job-search matching tool. The text was extracted from a PDF and may include a " +
  "sidebar section listing self-reported skills/certifications/languages (e.g. a \"Top Skills\" or " +
  "\"Certifications\" section) separately from the prose — treat entries in those sections as real skills even " +
  "if they don't appear elsewhere in the document. Read the full text and respond with ONLY a JSON object " +
  "matching this exact schema, no prose outside it: " +
  '{"skills": string[] (10-25 concise skill/tool/technology names, not full sentences — include self-reported ' +
  'skills/certifications verbatim, not just ones inferred from job descriptions), ' +
  '"yearsExp": number (total years of professional experience computed ONLY from Experience/work-history date ' +
  'ranges — do not count years spent in Education), ' +
  '"targetRoles": string (a short comma-separated guess at 2-3 logical next job titles based on their career trajectory), ' +
  '"summary": string (a 2-3 sentence first-person professional summary suitable for a job search profile — ' +
  'if the document already has a Summary/About section, base it on that rather than writing a generic one)}';

async function callGrokParseResume(apiKey, resumeText){
  const res = await fetch("https://api.x.ai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
    body: JSON.stringify({
      model: GROK_MODEL,
      response_format: { type: "json_object" },
      temperature: 0.3,
      messages: [
        { role: "system", content: RESUME_SYSTEM_PROMPT },
        { role: "user", content: "RESUME / LINKEDIN PROFILE TEXT:\n\n" + resumeText.slice(0, 12000) }
      ]
    })
  });
  if (!res.ok) throw new Error("Grok request failed (" + res.status + ")");
  const data = await res.json();
  return JSON.parse(data.choices[0].message.content);
}

async function parseResumeFile(file, settings){
  const text = await extractPdfText(file);
  if (!text.trim()) throw new Error("No text could be extracted from this PDF — it may be a scanned image rather than a text-based PDF.");

  if (settings.grokKey){
    try {
      const ai = await callGrokParseResume(settings.grokKey, text);
      return {
        skills: ai.skills || [],
        yearsExp: ai.yearsExp ?? null,
        targetRoles: ai.targetRoles || "",
        summary: ai.summary || "",
        source: "grok"
      };
    } catch(e){
      console.warn("Grok resume parsing failed — using the offline heuristic instead.", e);
      return parseResumeTextOffline(text);
    }
  }
  return parseResumeTextOffline(text);
}

/* ─────────────────────────────────────────────────────────────
   SMALL UI HELPERS
───────────────────────────────────────────────────────────── */
function scoreClass(score){
  if (score >= 8) return "score-high";
  if (score >= 4) return "score-mid";
  return "score-low";
}
function fmtMoney(n){
  if (n == null || n === "") return null;
  return "$" + Number(n).toLocaleString();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function comparableSourceLabel(source){
  if (source === "perplexity-live") return "Perplexity live search";
  if (source === "grok") return "Grok estimate";
  return "offline benchmark";
}
function hostnameOf(url){
