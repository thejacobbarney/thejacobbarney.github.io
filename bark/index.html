  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch(e){ return url; }
}

function ScoreDial({score}){
  return (
    <div className={"nb-score " + scoreClass(score)}>
      <div className="num">{score}<span className="denom">/10</span></div>
      <div className="lbl">match</div>
    </div>
  );
}

function Callout({type = "info", children}){
  return <div className={"nb-callout nb-callout-" + type}>{children}</div>;
}

function AddJobTab({profile, settings, onSave}){
  const [url, setUrl] = useState("");
  const [pasteText, setPasteText] = useState("");
  const [mode, setMode] = useState("url"); // 'url' | 'paste'
  const [fetching, setFetching] = useState(false);
  const [fetchError, setFetchError] = useState("");
  const [draft, setDraft] = useState(null);
  const [saving, setSaving] = useState(false);

  async function handleFetch(useProxy){
    if (!url.trim()) return;
    setFetching(true); setFetchError("");
    try {
      const html = useProxy ? await fetchViaProxy(url.trim()) : await fetchDirect(url.trim());
      const extracted = extractFromHTML(html);
      setDraft({ ...extracted, url: url.trim(), skillsText: extracted.skills.join(", ") });
    } catch(e){
      setFetchError((useProxy ? "Proxy fetch" : "Direct fetch") + " failed — most job boards (LinkedIn, Indeed) block cross-origin requests entirely. " +
        (useProxy ? "Try pasting the job description text instead." : "Try the demo proxy below, or switch to paste mode."));
    } finally {
      setFetching(false);
    }
  }

  function handleParsePaste(){
    if (!pasteText.trim()) return;
    const extracted = parseFreeText(pasteText);
    setDraft({ ...extracted, url: url.trim(), skillsText: extracted.skills.join(", ") });
  }

  function updateDraft(field, value){
    setDraft(d => ({ ...d, [field]: value }));
  }

  async function handleSave(){
    if (!draft || !draft.title){ return; }
    setSaving(true);
    const finalJob = {
      ...draft,
      skills: draft.skillsText.split(",").map(s => s.trim()).filter(Boolean),
      id: uid(),
      status: "In Progress",
      dateAdded: new Date().toISOString().slice(0,10)
    };

    const { fields, notes } = await evaluateJob(finalJob, profile, settings);
    onSave({ ...finalJob, ...fields }, notes.length ? notes.join(" ") : null);

    setDraft(null); setUrl(""); setPasteText(""); setSaving(false);
  }

  return (
    <div>
      <div className="nb-panel">
        <div className="nb-panel-head">
          <div>
            <div className="nb-eyebrow">Step 1</div>
            <div className="nb-title">Pull in a listing</div>
          </div>
          <div style={{display:"flex", gap:"0.5rem"}}>
            <button className={"nb-tab nb-btn-sm " + (mode === "url" ? "active" : "")} onClick={() => setMode("url")}>By URL</button>
            <button className={"nb-tab nb-btn-sm " + (mode === "paste" ? "active" : "")} onClick={() => setMode("paste")}>Paste Text</button>
          </div>
        </div>

        {mode === "url" ? (
          <div>
            <Callout type="info">
              <span>Company career pages (Greenhouse, Lever, Workday, most in-house sites) embed structured
              <code>JobPosting</code> data we can read directly. <strong>LinkedIn and Indeed block cross-origin
              requests</strong> — for those, switch to "Paste Text" below and drop in the description.</span>
            </Callout>
            <div className="nb-row" style={{alignItems:"flex-end"}}>
              <div className="nb-field" style={{flex:3}}>
                <label className="nb-label">Job listing URL</label>
                <input className="nb-input" placeholder="https://boards.greenhouse.io/company/jobs/1234"
                  value={url} onChange={e => setUrl(e.target.value)} />
              </div>
              <button className="nb-btn nb-btn-primary" disabled={fetching || !url.trim()} onClick={() => handleFetch(false)}>
                {fetching ? "Fetching…" : "Fetch Listing"}
              </button>
            </div>
            {fetchError && (
              <div style={{marginTop:"0.75rem"}}>
                <Callout type="warn">
                  <span>{fetchError}</span>
                </Callout>
                <button className="nb-btn nb-btn-sm" onClick={() => handleFetch(true)} disabled={fetching}>
                  {fetching ? "Trying proxy…" : "Try demo CORS proxy instead ↗"}
                </button>
                <div className="nb-hint" style={{marginTop:"0.4rem"}}>Routes the request through a public third-party proxy (allorigins.win) — only use this for public, non-sensitive listing URLs.</div>
              </div>
            )}
          </div>
        ) : (
          <div>
            <Callout type="info">
              <span>Copy the full job description off the page (title, company, requirements, salary if listed) and paste it below. This always works, regardless of the source site's anti-bot protection.</span>
            </Callout>
            <div className="nb-field">
              <label className="nb-label">Raw job posting text</label>
              <textarea className="nb-textarea" rows="8" placeholder="Senior Product Manager&#10;Acme Corp&#10;Remote — $130,000 - $160,000&#10;&#10;About the role..."
                value={pasteText} onChange={e => setPasteText(e.target.value)} />
            </div>
            <div className="nb-field">
              <label className="nb-label">Source URL (optional)</label>
              <input className="nb-input" placeholder="https://www.linkedin.com/jobs/view/…" value={url} onChange={e => setUrl(e.target.value)} />
            </div>
            <button className="nb-btn nb-btn-primary" disabled={!pasteText.trim()} onClick={handleParsePaste}>Parse Text</button>
          </div>
        )}
      </div>

      {draft && (
        <div className="nb-panel">
          <div className="nb-panel-head">
            <div>
              <div className="nb-eyebrow">Step 2 · Source: {draft.source}</div>
              <div className="nb-title">Review &amp; edit</div>
            </div>
            <span className="nb-badge">Edit anything before saving</span>
          </div>

          <div className="nb-row">
            <div className="nb-field">
              <label className="nb-label">Job title</label>
              <input className="nb-input" value={draft.title} onChange={e => updateDraft("title", e.target.value)} />
            </div>
            <div className="nb-field">
              <label className="nb-label">Company</label>
              <input className="nb-input" value={draft.company} onChange={e => updateDraft("company", e.target.value)} />
            </div>
          </div>
          <div className="nb-row">
            <div className="nb-field">
              <label className="nb-label">Location</label>
              <input className="nb-input" value={draft.location} onChange={e => updateDraft("location", e.target.value)} />
            </div>
            <div className="nb-field">
              <label className="nb-label">Work form</label>
              <select className="nb-select" value={draft.workForm} onChange={e => updateDraft("workForm", e.target.value)}>
                <option value="">Unspecified</option>
                <option>Remote</option>
                <option>Hybrid</option>
                <option>Onsite</option>
              </select>
            </div>
          </div>
          <div className="nb-row">
            <div className="nb-field">
              <label className="nb-label">Salary min</label>
              <input className="nb-input" type="number" value={draft.salaryMin || ""} onChange={e => updateDraft("salaryMin", e.target.value ? Number(e.target.value) : null)} />
            </div>
            <div className="nb-field">
              <label className="nb-label">Salary max</label>
              <input className="nb-input" type="number" value={draft.salaryMax || ""} onChange={e => updateDraft("salaryMax", e.target.value ? Number(e.target.value) : null)} />
            </div>
          </div>
          <div className="nb-field">
            <label className="nb-label">Detected skills (comma separated — edit freely)</label>
            <input className="nb-input" value={draft.skillsText} onChange={e => updateDraft("skillsText", e.target.value)} />
          </div>
          <div className="nb-field">
            <label className="nb-label">Full description</label>
            <textarea className="nb-textarea" rows="6" value={draft.description} onChange={e => updateDraft("description", e.target.value)} />
          </div>

          {!profile.skills.length && (
            <Callout type="warn"><span>Your profile has no skills yet — the match score will be rough. Fill out the <strong>Profile</strong> tab first for a real read.</span></Callout>
          )}

          <button className="nb-btn nb-btn-purple nb-btn-block" disabled={saving || !draft.title} onClick={handleSave}>
            {saving ? "Analyzing…" : (settings.grokKey ? "Analyze with AI & Save" : "Analyze & Save")}
          </button>
        </div>
      )}
    </div>
  );
}

  function copyRaw(){

    navigator.clipboard.writeText(text).catch(() => {});

  return (
    <div className="job-card">

        <div className="job-card-main">

                  (job.comparableConfidence ? " · " + job.comparableConfidence + " confidence" : "") +
                  (job.comparableRationale ? " — " + job.comparableRationale : "")}>
                {job.comparableSource === "perplexity-live" ? "🔎 " : ""}Market {fmtMoney(job.comparableSalaryLow)}–{fmtMoney(job.comparableSalaryHigh)}
              </span>
            )}

          <div className="job-actions">

            <button className="nb-btn nb-btn-sm" onClick={() => setOpen(o => !o)}>{open ? "Hide Role Evaluation" : "View Role Evaluation"}</button>

        <React.Fragment>
          <div className="job-analysis">

              <div style={{marginTop:"0.6rem", fontSize:"0.76rem"}}>
                <strong>Sources: </strong>
                {job.comparableCitations.slice(0, 4).map((url, i) => (

                    {i > 0 && ", "}
                    <a href={url} target="_blank" rel="noopener" style={{color:"var(--purple-dark)", textDecoration:"underline"}}>{hostnameOf(url)}</a>
                  </React.Fragment>
                ))}
              </div>
            )}

function DashboardTab({jobs, onStatusChange, onDelete, onRefresh, onRefreshAll, settings}){
  const [statusFilter, setStatusFilter] = useState("All");
  const [sortBy, setSortBy] = useState("date");
  const [sheetsBusy, setSheetsBusy] = useState(false);
  const [sheetsError, setSheetsError] = useState("");
  const [refreshingIds, setRefreshingIds] = useState(() => new Set());
  const [refreshingAll, setRefreshingAll] = useState(false);

  async function handleRefreshOne(id){
    setRefreshingIds(s => new Set(s).add(id));
    try { await onRefresh(id); }
    finally { setRefreshingIds(s => { const n = new Set(s); n.delete(id); return n; }); }
  }

  async function handleRefreshAll(){
    setRefreshingAll(true);
    try { await onRefreshAll(); }
    finally { setRefreshingAll(false); }
  }

  const filtered = useMemo(() => {
    let list = statusFilter === "All" ? jobs : jobs.filter(j => j.status === statusFilter);
    list = [...list].sort((a,b) => {
      if (sortBy === "score") return b.matchScore - a.matchScore;
      if (sortBy === "salary") return (b.salaryTarget || 0) - (a.salaryTarget || 0);
      return (b.dateAdded || "").localeCompare(a.dateAdded || "");
    });
    return list;
  }, [jobs, statusFilter, sortBy]);

  async function handleSheetsExport(){
    if (!settings.googleClientId){ setSheetsError("Add a Google OAuth Client ID in Settings first."); return; }
    setSheetsBusy(true); setSheetsError("");
    try { await exportToGoogleSheets(jobs, settings.googleClientId); }
    catch(e){ setSheetsError(e.message || "Export failed."); }
    finally { setSheetsBusy(false); }
  }

  return (
    <div className="nb-panel">
      <div className="nb-panel-head">
        <div>
          <div className="nb-eyebrow">Pipeline</div>
          <div className="nb-title">{jobs.length} Tracked Job{jobs.length === 1 ? "" : "s"}</div>
        </div>
        <div style={{display:"flex", gap:"0.5rem", flexWrap:"wrap"}}>
          <select className="nb-select nb-btn-sm" style={{width:"auto"}} value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
            <option>All</option>
            {STATUS_OPTIONS.map(s => <option key={s}>{s}</option>)}
          </select>
          <select className="nb-select nb-btn-sm" style={{width:"auto"}} value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="date">Newest first</option>
            <option value="score">Highest match</option>
            <option value="salary">Highest target salary</option>
          </select>
          <button className="nb-btn nb-btn-sm" onClick={handleRefreshAll} disabled={!jobs.length || refreshingAll}>
            {refreshingAll ? "Refreshing…" : "Refresh All Scores"}
          </button>
          <button className="nb-btn nb-btn-sm nb-btn-yellow" onClick={() => exportCSV(jobs)} disabled={!jobs.length}>Export CSV</button>
          <button className="nb-btn nb-btn-sm nb-btn-primary" onClick={handleSheetsExport} disabled={!jobs.length || sheetsBusy}>
            {sheetsBusy ? "Exporting…" : "Export to Sheets"}
          </button>
        </div>
      </div>

      {sheetsError && <Callout type="warn"><span>{sheetsError}</span></Callout>}

      {filtered.length ? (
        <div className="job-list">
          {filtered.map(job => (
            <JobCard key={job.id} job={job} onStatusChange={onStatusChange} onDelete={onDelete}
              onRefresh={() => handleRefreshOne(job.id)} refreshing={refreshingIds.has(job.id)} />
          ))}
        </div>
      ) : (
        <div className="nb-empty">
          <div className="nb-empty-emoji">🗂️</div>
          <div style={{fontWeight:700}}>Nothing tracked yet</div>
          <div className="nb-hint">Head to "Add Job" to pull in your first listing.</div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   PROFILE TAB
───────────────────────────────────────────────────────────── */
function ProfileTab({profile, settings, onChange}){
  const [local, setLocal] = useState(profile);
  const [importing, setImporting] = useState(false);
  const [importError, setImportError] = useState("");
  const [imported, setImported] = useState(null);
  const fileInputRef = useRef(null);
  useEffect(() => setLocal(profile), [profile]);

  function field(key, value){ setLocal(l => ({...l, [key]: value})); }
  function save(){
    onChange({
      ...local,
      skills: (local.skillsText != null ? local.skillsText : local.skills.join(", ")).split(",").map(s => s.trim()).filter(Boolean)
    });
  }

  async function handleFileSelected(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImporting(true); setImportError(""); setImported(null);
    try {
      const result = await parseResumeFile(file, settings);
      setImported(result);
    } catch(err){
      setImportError(err.message || "Could not parse this file.");
    } finally {
      setImporting(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  }

  function applyImported(){
    if (!imported) return;
    const existingSkills = (local.skillsText != null ? local.skillsText : local.skills.join(", "))
      .split(",").map(s => s.trim()).filter(Boolean);
    const mergedSkills = [...existingSkills];
    (imported.skills || []).forEach(s => {
      if (!mergedSkills.some(e => e.toLowerCase() === s.toLowerCase())) mergedSkills.push(s);
    });
    setLocal(l => ({
      ...l,
      skillsText: mergedSkills.join(", "),
      yearsExp: imported.yearsExp != null ? imported.yearsExp : l.yearsExp,
      targetRoles: imported.targetRoles || l.targetRoles,
      summary: imported.summary || l.summary
    }));
    setImported(null);
  }

  return (
    <div className="nb-panel">
      <div className="nb-panel-head">
        <div>
          <div className="nb-eyebrow">Your Background</div>
          <div className="nb-title">Profile</div>
        </div>
        <span className="nb-sub">Powers the match score, salary target, and career analysis for every job you save.</span>
      </div>

      <Callout type="info">
        <span>Import from a resume or a LinkedIn "Save to PDF" profile export — pulls out skills, years of
        experience, target roles, and a summary. Works offline (skill-keyword matching + years estimated from
        work-history dates); set a Grok key in Settings for a much better read on unstructured resume text.</span>
      </Callout>

      <div className="nb-field">
        <label className="nb-label">Import from PDF (resume or LinkedIn profile export)</label>
        <input ref={fileInputRef} className="nb-input" type="file" accept="application/pdf" onChange={handleFileSelected} disabled={importing} />
        {importing && <span className="nb-hint">Reading PDF…</span>}
      </div>

      {importError && <Callout type="warn"><span>{importError}</span></Callout>}

      {imported && (
        <div style={{border:"2.5px solid var(--ink)", background:"var(--cream-2)", padding:"1.25rem 1.4rem", marginTop:"1rem", marginBottom:"1.5rem"}}>
          <div className="nb-eyebrow" style={{marginBottom:"0.9rem"}}>
            Extracted from PDF · {imported.source === "grok" ? "Grok" : "offline heuristic"}
          </div>
          <div className="nb-field">
            <label className="nb-label">Skills (will merge into your existing list, deduped)</label>
            <textarea className="nb-textarea" rows="2" value={imported.skills.join(", ")}
              onChange={e => setImported(im => ({...im, skills: e.target.value.split(",").map(s => s.trim()).filter(Boolean)}))} />
          </div>
          <div className="nb-row">
            <div className="nb-field">
              <label className="nb-label">Years of experience</label>
              <input className="nb-input" type="number" value={imported.yearsExp ?? ""}
                onChange={e => setImported(im => ({...im, yearsExp: e.target.value ? Number(e.target.value) : null}))} />
            </div>
            <div className="nb-field">
              <label className="nb-label">Target roles</label>
              <input className="nb-input" value={imported.targetRoles} onChange={e => setImported(im => ({...im, targetRoles: e.target.value}))} />
            </div>
          </div>
          <div className="nb-field">
            <label className="nb-label">Summary</label>
            <textarea className="nb-textarea" rows="3" value={imported.summary} onChange={e => setImported(im => ({...im, summary: e.target.value}))} />
          </div>
          <div className="nb-hint" style={{marginBottom:"0.75rem"}}>Applying replaces years of experience, target roles, and summary with what's shown above — edit anything first if it's off.</div>
          <div style={{display:"flex", gap:"0.5rem"}}>
            <button className="nb-btn nb-btn-purple nb-btn-sm" onClick={applyImported}>Apply to Profile</button>
            <button className="nb-btn nb-btn-sm" onClick={() => setImported(null)}>Discard</button>
          </div>
        </div>
      )}

      <div className="nb-row">
        <div className="nb-field">
          <label className="nb-label">Name</label>
          <input className="nb-input" value={local.name} onChange={e => field("name", e.target.value)} />
        </div>
        <div className="nb-field">
          <label className="nb-label">Years of experience</label>
          <input className="nb-input" type="number" value={local.yearsExp} onChange={e => field("yearsExp", Number(e.target.value))} />
        </div>
      </div>

      <div className="nb-field">
        <label className="nb-label">Target roles</label>
        <input className="nb-input" placeholder="Senior Financial Analyst, FP&A Manager…" value={local.targetRoles} onChange={e => field("targetRoles", e.target.value)} />
      </div>

      <div className="nb-field">
        <label className="nb-label">Skills (comma separated)</label>
        <textarea className="nb-textarea" rows="3" value={local.skillsText != null ? local.skillsText : local.skills.join(", ")}
          onChange={e => field("skillsText", e.target.value)} />
        <span className="nb-hint">Matched word-for-word (loosely) against each job's detected skill list.</span>
      </div>

      <div className="nb-row">
        <div className="nb-field">
          <label className="nb-label">Current salary</label>
          <input className="nb-input" type="number" value={local.currentSalary} onChange={e => field("currentSalary", e.target.value)} />
        </div>
        <div className="nb-field">
          <label className="nb-label">Target salary</label>
          <input className="nb-input" type="number" value={local.targetSalary} onChange={e => field("targetSalary", e.target.value)} />
        </div>
      </div>

      <div className="nb-field">
        <label className="nb-label">Background summary</label>
        <textarea className="nb-textarea" rows="4" placeholder="2-3 sentences on your experience — used as extra context if AI evaluation is enabled."
          value={local.summary} onChange={e => field("summary", e.target.value)} />
      </div>

      <button className="nb-btn nb-btn-purple" onClick={save}>Save Profile</button>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   ANALYTICS TAB
───────────────────────────────────────────────────────────── */
function AnalyticsTab({jobs}){
  const stats = useMemo(() => {
    const total = jobs.length;
    const avgScore = total ? Math.round((jobs.reduce((a,j) => a + (j.matchScore||0), 0) / total) * 10) / 10 : 0;
    const salaries = jobs.map(j => j.salaryTarget).filter(Boolean);
    const avgTarget = salaries.length ? Math.round(salaries.reduce((a,b)=>a+b,0)/salaries.length) : null;

    const byStatus = {};
    STATUS_OPTIONS.forEach(s => byStatus[s] = 0);
    jobs.forEach(j => { byStatus[j.status] = (byStatus[j.status]||0) + 1; });

    const byWorkForm = {};
    jobs.forEach(j => { const k = j.workForm || "Unspecified"; byWorkForm[k] = (byWorkForm[k]||0)+1; });

    const skillFreq = {};
    jobs.forEach(j => (j.skills||[]).forEach(s => { skillFreq[s] = (skillFreq[s]||0)+1; }));
    const topSkills = Object.entries(skillFreq).sort((a,b)=>b[1]-a[1]).slice(0,8);

    const companyFreq = {};
    jobs.forEach(j => { if (j.company) companyFreq[j.company] = (companyFreq[j.company]||0)+1; });

    return { total, avgScore, avgTarget, byStatus, byWorkForm, topSkills, companyCount: Object.keys(companyFreq).length };
  }, [jobs]);

  const maxStatus = Math.max(1, ...Object.values(stats.byStatus));
  const maxSkill = Math.max(1, ...stats.topSkills.map(s => s[1]));

  if (!jobs.length){
    return (
      <div className="nb-panel">
        <div className="nb-empty">
          <div className="nb-empty-emoji">📊</div>
          <div style={{fontWeight:700}}>No data yet</div>
          <div className="nb-hint">Track a few jobs and trends will show up here.</div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="nb-grid-3" style={{marginTop:"1.75rem"}}>
        <div className="stat-tile"><div className="n">{stats.total}</div><div className="l">Jobs Tracked</div></div>
        <div className="stat-tile"><div className="n">{stats.avgScore}<span style={{fontSize:"1rem"}}>/10</span></div><div className="l">Avg Match Score</div></div>
        <div className="stat-tile"><div className="n">{stats.avgTarget ? fmtMoney(stats.avgTarget) : "—"}</div><div className="l">Avg Salary Target</div></div>
      </div>

      <div className="nb-panel">
        <div className="nb-panel-head"><div className="nb-title" style={{fontSize:"1.1rem"}}>Pipeline breakdown</div></div>
        {STATUS_OPTIONS.map(s => (
          <div className="bar-row" key={s}>
            <div className="bar-label">{s}</div>
            <div className="bar-track"><div className="bar-fill" style={{width:(stats.byStatus[s]/maxStatus*100)+"%"}}></div></div>
            <div className="bar-count">{stats.byStatus[s]}</div>
          </div>
        ))}
      </div>

      <div className="nb-grid-2">
        <div className="nb-panel">
          <div className="nb-panel-head"><div className="nb-title" style={{fontSize:"1.1rem"}}>Most-requested skills</div></div>
          {stats.topSkills.length ? stats.topSkills.map(([skill,count]) => (
            <div className="bar-row" key={skill}>
              <div className="bar-label">{skill}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:(count/maxSkill*100)+"%", background:"var(--purple)"}}></div></div>
              <div className="bar-count">{count}</div>
            </div>
          )) : <div className="nb-hint">No skills detected across saved jobs yet.</div>}
        </div>

        <div className="nb-panel">
          <div className="nb-panel-head"><div className="nb-title" style={{fontSize:"1.1rem"}}>Work format</div></div>
          {Object.entries(stats.byWorkForm).map(([k,v]) => (
            <div className="bar-row" key={k}>
              <div className="bar-label">{k}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:(v/stats.total*100)+"%", background:"var(--yellow)"}}></div></div>
              <div className="bar-count">{v}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   SETTINGS TAB
───────────────────────────────────────────────────────────── */
function ConnectionStatusBadge({state, testing}){
  if (testing) return <Callout type="info"><span>Testing connection…</span></Callout>;
  if (!state) return null;
  const when = new Date(state.checkedAt).toLocaleString();
  if (state.ok){
    return <Callout type="ok"><span><strong>Connected</strong> — checked {when}.</span></Callout>;
  }
  return <Callout type="error"><span><strong>Failed:</strong> {state.message} — checked {when}.</span></Callout>;
}

function SettingsTab({settings, onChange, connectionStatus, onTestResult}){
  const [local, setLocal] = useState(settings);
  useEffect(() => setLocal(settings), [settings]);
  const [testing, setTesting] = useState({ grok:false, perplexity:false });

  async function handleTest(provider){
    const key = provider === "grok" ? local.grokKey : local.perplexityKey;
    if (!key.trim()) return;
    setTesting(t => ({...t, [provider]: true}));
    const result = provider === "grok" ? await testGrokConnection(key) : await testPerplexityConnection(key);
    setTesting(t => ({...t, [provider]: false}));
    onTestResult(provider, { ...result, checkedAt: Date.now() });
  }

  return (
    <div className="nb-panel">
      <div className="nb-panel-head">
        <div>
          <div className="nb-eyebrow">Optional</div>
          <div className="nb-title">Settings</div>
        </div>
      </div>

      <Callout type="info">
        <span>Everything in this app runs entirely in your browser — jobs, profile, and these keys are stored in
        <code>localStorage</code> on this device only, nothing is sent to any server we control. Keys you add here
        are sent directly from your browser to Grok / Perplexity / Google, which is fine for personal use but not
        how you'd ship this to other users (see the architecture doc for the production pattern).</span>
      </Callout>

      <div className="nb-field">
        <label className="nb-label">Grok API key (optional)</label>
        <div className="nb-row" style={{alignItems:"flex-end"}}>
          <input className="nb-input" style={{flex:1}} type="password" placeholder="xai-…" value={local.grokKey}
            onChange={e => setLocal(l => ({...l, grokKey: e.target.value}))} />
          <button className="nb-btn nb-btn-sm" disabled={!local.grokKey.trim() || testing.grok} onClick={() => handleTest("grok")}>
            {testing.grok ? "Testing…" : "Test Connection"}
          </button>
        </div>
        <span className="nb-hint">When set, "Analyze &amp; Save" calls grok-4-fast (xAI) for the match score, salary target, and career analysis instead of the offline heuristic engine — also used for resume/LinkedIn PDF parsing on the Profile tab. Get a key at console.x.ai.</span>
        <ConnectionStatusBadge state={connectionStatus.grok} testing={testing.grok} />
      </div>

      <div className="nb-field">
        <label className="nb-label">Perplexity API key (optional, for live salary benchmarks)</label>
        <div className="nb-row" style={{alignItems:"flex-end"}}>
          <input className="nb-input" style={{flex:1}} type="password" placeholder="pplx-…" value={local.perplexityKey}
            onChange={e => setLocal(l => ({...l, perplexityKey: e.target.value}))} />
          <button className="nb-btn nb-btn-sm" disabled={!local.perplexityKey.trim() || testing.perplexity} onClick={() => handleTest("perplexity")}>
            {testing.perplexity ? "Testing…" : "Test Connection"}
          </button>
        </div>
        <span className="nb-hint">When set and a listing has no posted salary, calls Perplexity's sonar model — web search is built into the model, so this pulls a live comparable-role range (min/median/max + confidence) with real source citations instead of the hardcoded benchmark table. Get a key at perplexity.ai/settings/api.</span>
        <ConnectionStatusBadge state={connectionStatus.perplexity} testing={testing.perplexity} />
      </div>

      <div className="nb-field">
        <label className="nb-label">Google OAuth Client ID (optional, for Sheets export)</label>
        <input className="nb-input" placeholder="xxxxxxxx.apps.googleusercontent.com" value={local.googleClientId}
          onChange={e => setLocal(l => ({...l, googleClientId: e.target.value}))} />
        <span className="nb-hint">Create an OAuth 2.0 Client ID (Web application) in Google Cloud Console, enable the Sheets API, and add this page's origin to Authorized JavaScript origins.</span>
      </div>

      <button className="nb-btn nb-btn-purple" onClick={() => onChange(local)}>Save Settings</button>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   APP SHELL
───────────────────────────────────────────────────────────── */
function App(){
  const [tab, setTab] = useState("dashboard");
  const [jobs, setJobs] = useState(() => loadLS(LS_KEYS.jobs, []));
  const [profile, setProfile] = useState(() => loadLS(LS_KEYS.profile, DEFAULT_PROFILE));
  const [settings, setSettings] = useState(() => loadLS(LS_KEYS.settings, DEFAULT_SETTINGS));
  const [connectionStatus, setConnectionStatus] = useState(() => loadLS(LS_KEYS.connectionStatus, { grok:null, perplexity:null }));

  const [toast, setToast] = useState(null);

  useEffect(() => saveLS(LS_KEYS.jobs, jobs), [jobs]);
  useEffect(() => saveLS(LS_KEYS.profile, profile), [profile]);
  useEffect(() => saveLS(LS_KEYS.settings, settings), [settings]);
  useEffect(() => saveLS(LS_KEYS.connectionStatus, connectionStatus), [connectionStatus]);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 8000);
    return () => clearTimeout(t);
  }, [toast]);

  function addJob(job, note){
    setJobs(list => [job, ...list]);
    setToast(note || null);
    setTab("dashboard");
  }
  function updateStatus(id, status){
    setJobs(list => list.map(j => j.id === id ? {...j, status} : j));
  }
  function deleteJob(id){
    setJobs(list => list.filter(j => j.id !== id));
  }

  async function refreshJob(id){
    const job = jobs.find(j => j.id === id);
    if (!job) return;
    const { fields, notes } = await evaluateJob(job, profile, settings);
    setJobs(list => list.map(j => j.id === id ? { ...j, ...fields } : j));
    if (notes.length) setToast(notes.join(" "));
  }

  async function refreshAllJobs(){
    const results = await Promise.all(jobs.map(async j => {
      try {
        const { fields, notes } = await evaluateJob(j, profile, settings);
        return { id: j.id, fields, notes };
      } catch(e){
        return { id: j.id, fields: null, notes: ['Refresh failed for "' + j.title + '": ' + e.message] };
      }
    }));
    setJobs(list => list.map(j => {
      const r = results.find(x => x.id === j.id);
      return (r && r.fields) ? { ...j, ...r.fields } : j;
    }));
    const allNotes = results.flatMap(r => r.notes || []);
    if (allNotes.length) setToast(allNotes.slice(0, 3).join(" "));
  }

  const tabs = [
    { id:"dashboard", label:"Dashboard", count: jobs.length },
    { id:"add", label:"Add Job" },
    { id:"profile", label:"Profile" },
    { id:"analytics", label:"Analytics" },
    { id:"settings", label:"Settings" }
  ];

  return (
    <div>
      <div className="nb-topbar">
        <div className="nb-topbar-inner">
          <div className="nb-logo">
            <img className="nb-logo-mark" src="assets/bark-icon.svg" alt="Bark" />
            <span>BARK <span style={{color:"var(--purple)"}}>//</span> JOB TRACKER &amp; AI EVALUATOR</span>
          </div>
          <a className="nb-back" href="https://thejacobbarney.com/#personal">← thejacobbarney.com</a>
        </div>
      </div>

      <div className="nb-shell">
        <div className="hero-strip">
          <div>
            <h1>Paste a listing. Get a verdict.</h1>
            <p>Match score, salary target, and a straight-talk read on whether it's worth your time — <span className="accent">then track the whole pipeline</span> in one place.</p>
          </div>
          <div className="nb-badge" style={{background:"var(--ink)", color:"#fff", borderColor:"#fff"}}>Lab Build</div>
        </div>

        {toast && (
          <div className="nb-callout nb-callout-warn" style={{marginTop:"1.25rem", justifyContent:"space-between", alignItems:"center"}}>
            <span>{toast}</span>
            <button className="nb-btn nb-btn-sm" onClick={() => setToast(null)}>Dismiss</button>
          </div>
        )}

        <div className="nb-tabs">
          {tabs.map(t => (
            <button key={t.id} className={"nb-tab " + (tab === t.id ? "active" : "")} onClick={() => setTab(t.id)}>
              {t.label}{t.count != null && <span className="count">{t.count}</span>}
            </button>
          ))}
        </div>

        {tab === "dashboard" && <DashboardTab jobs={jobs} onStatusChange={updateStatus} onDelete={deleteJob} onRefresh={refreshJob} onRefreshAll={refreshAllJobs} settings={settings} />}
        {tab === "add" && <AddJobTab profile={profile} settings={settings} onSave={addJob} />}
        {tab === "profile" && <ProfileTab profile={profile} settings={settings} onChange={setProfile} />}
        {tab === "analytics" && <AnalyticsTab jobs={jobs} />}
        {tab === "settings" && <SettingsTab settings={settings} onChange={setSettings} connectionStatus={connectionStatus}
          onTestResult={(provider, result) => setConnectionStatus(s => ({...s, [provider]: result}))} />}
      </div>
    </div>
  );
}
