<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swoon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --pink: #d4a82b;
    --pink-dark: #ecc34f;
    --pink-soft: #7a6120;
    --ink: #f6ecd0;
    --muted: #a39679;
    --card: #14110a;
    --chip: #231e12;
    --bg1: #000000;
    --bg2: #231a06;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1) 0%, #0c0a05 55%, var(--bg2) 100%);
    background-attachment: fixed;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  .shell { width: 100%; max-width: 560px; flex: 1; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.03em; }
  .brand svg { width: 28px; height: 28px; fill: var(--pink); }
  .count { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .bar { height: 3px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .45s ease; }

  main { flex: 1; display: flex; align-items: center; }
  .card {
    width: 100%; min-height: 440px; background: var(--card); border-radius: 32px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,.9), 0 0 0 1px rgba(212,168,43,.18) inset;
    padding: 36px 28px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; position: relative; animation: pop .4s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--pink); margin-bottom: 14px; }
  h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.02; letter-spacing: -0.045em; margin: 0 0 14px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 26px; }
  .tiny { color: var(--muted); font-size: 12px; margin-top: 22px; }

  .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; letter-spacing: .02em;
    background: var(--pink); color: #14110a; padding: 16px 30px; border-radius: 999px; font-size: 15px;
    box-shadow: 0 12px 24px -10px rgba(212,168,43,.45); transition: transform .15s, background .2s, opacity .2s;
  }
  .btn:hover { transform: translateY(-1px); background: var(--pink-dark); }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { background: #3a2f12; color: #8a7a4a; box-shadow: none; cursor: not-allowed; transform: none; }
  .btn.ghost { background: var(--chip); color: var(--ink); box-shadow: none; }

  /* step 1 */
  .ask-zone { position: relative; width: 100%; height: 150px; margin-top: 4px; }
  .ask-zone .yes { position: absolute; left: 12%; top: 24px; }
  .ask-zone .no { position: absolute; right: 12%; top: 70px; padding: 14px 26px; transition: left .25s ease, top .25s ease, right .25s ease, transform .15s; }

  /* step 2 */
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 26px; }
  .chip {
    appearance: none; border: 2px solid transparent; font: inherit; font-weight: 700; font-size: 15px; color: var(--ink);
    background: var(--chip); padding: 14px 18px; border-radius: 18px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 10px; transition: transform .15s, border-color .15s, background .15s;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip.on { border-color: var(--pink); background: #2e2614; box-shadow: 0 8px 18px -10px rgba(212,168,43,.4); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 26px; }

  /* step 3 */
  .field { width: 100%; max-width: 420px; text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 800; margin: 0 0 6px 2px; }
  .field input, .field select {
    width: 100%; font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    background: var(--chip); border: 2px solid transparent; border-radius: 16px; padding: 14px 16px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--pink); background: #2a2315; }

  /* step 6 */
  .paper { width: 100%; background: #1b160c; border: 1px solid rgba(212,168,43,.25); border-radius: 22px; padding: 22px 20px; text-align: left; box-shadow: 0 10px 30px -18px rgba(0,0,0,.3); margin-bottom: 22px; position: relative; }
  .paper .heart { position: absolute; top: 18px; right: 18px; width: 18px; fill: var(--pink); }
  .paper .tag { font-size: 10px; font-weight: 800; letter-spacing: .18em; color: var(--pink); }
  .paper h2 { font-size: 34px; letter-spacing: -0.045em; line-height: 1; margin: 6px 0 4px; }
  .paper h2 sup { font-size: .4em; vertical-align: super; }
  .paper .joke { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid rgba(212,168,43,.25); }
  .line { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .line b { font-size: 17px; }
  .fine { font-size: 12px; color: var(--muted); margin: 4px 0 14px; }
  .slot { background: #261f10; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; gap: 10px; }
  .footnote { font-size: 11px; color: var(--muted); margin-top: 14px; }

  /* done */
  .receipt { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #1b160c; border: 1px solid rgba(212,168,43,.25); border-radius: 16px; padding: 16px 18px; text-align: left; width: 100%; max-width: 360px; margin: 0 0 20px; }
  .receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .receipt hr { border: 0; border-top: 1px dashed #5b4a1c; margin: 8px 0; }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 10px; }
  .link { color: var(--pink); font-weight: 800; text-decoration: none; }


  .field textarea { width: 100%; font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); background: var(--chip); border: 2px solid transparent; border-radius: 16px; padding: 14px 16px; outline: none; resize: vertical; }
  .field textarea:focus { border-color: var(--pink); background: #2a2315; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .namepick { font: inherit; letter-spacing: inherit; font-weight: 800; color: var(--pink); background: transparent; border: 0; border-bottom: 3px dashed var(--pink-soft); border-radius: 0; padding: 0 2px; cursor: pointer; outline: none; max-width: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btns .btn { text-decoration: none; display: inline-block; }

  footer { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .18em; color: #8b7b50; padding: 18px 0 6px; text-transform: uppercase; }
  footer span { color: var(--pink); }

  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  @media (max-width: 420px) { .card { padding: 30px 18px 26px; border-radius: 26px; } .paper h2 { font-size: 28px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 2.8 4.5 6.4 4.5c2 0 3.6 1 4.6 2.6l1 1.4 1-1.4c1-1.6 2.6-2.6 4.6-2.6 3.6 0 5.5 3.7 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
      Swoon
    </div>
    <div class="count" id="count">1 / 6</div>
  </header>
  <div class="bar"><i id="progress"></i></div>
  <main><section class="card" id="card" aria-live="polite"></section></main>
  <footer>Dates go better here <span>&#9829;</span></footer>
</div>
<canvas id="confetti"></canvas>

<script>
/* ---------------------------------------------------------------
   EDIT ME. Everything you might want to change lives here.
---------------------------------------------------------------- */
const CONFIG = {
  herName: "Camryn",                 // always pre-selected, and the only name that sticks (see names)
  names: ["Aaliyah", "Ava", "Bella", "Charlotte", "Camryn", "Chloe", "Emily", "Emma", "Grace", "Harper", "Isabella", "Jessica", "Layla", "Lily", "Mia", "Olivia", "Sophia"],
  yourName: "Jake",                  // used in the notification you receive and the calendar event
  // How you get her answers. Use ONE or both:
  //  1) Formspree (free): create a form at formspree.io, paste the endpoint here.
  //     It emails you when she finishes. Example: "https://formspree.io/f/abcdwxyz"
  formEndpoint: "https://formspree.io/f/xzezwokz",
  //  2) SMS fallback: your phone number, digits only. Opens a prefilled text she can send you.
  yourPhone: "",
  defaultDate: "",                   // "YYYY-MM-DD". Leave blank to default to the next Friday.
  times: ["5:00 PM", "6:00 PM", "7:00 PM", "8:00 PM", "whenever, I'm easy"],
  foods: [
    ["\u{1F355}", "Pizza"], ["\u{1F363}", "Sushi"],
    ["\u{1F354}", "Burgers"], ["\u{1F35D}", "Pasta"],
    ["\u{1F32E}", "Tacos"], ["\u{1F35C}", "Ramen"]
  ],
  // Step 2: where. The third value drives the follow-up question.
  places: [
    ["\u{1F306}", "Out on the town", "out"],
    ["\u{1F3E0}", "At home", "home"],
    ["\u{1F917}", "Surprise me", "surprise"]
  ],
  // Follow-up when she picks "out". A label containing "Uber Eats" or "Cook" changes the later copy.
  dress: [
    ["\u{1F60C}", "Comfy and casual"], ["\u2728", "A little cute"],
    ["\u{1F483}", "Dressed up"], ["\u{1F451}", "Fancy fancy"]
  ],
  // Follow-up when she picks "at home".
  homePlans: [
    ["\u{1F6CB}\uFE0F", "Uber Eats and chill"], ["\u{1F9D1}\u200D\u{1F373}", "Cook at home together"]
  ],
  afters: [
    ["\u{1F366}", "Dessert"], ["\u{1F319}", "A walk"],
    ["\u{1F3AC}", "A movie"], ["\u{1F3B2}", "Game night"],
    ["\u2B50", "Stargazing"], ["\u{1F917}", "Surprise me"]
  ],
  defaultTime: "7:00 PM",            // used when she picks "whenever, I'm easy"
  pickupLeadMinutes: 0,              // be ready this many minutes before the time she picks
  psText: "P.S. normal people text. I made a website during lunch, for you. no big deal.",
  price: "$499",
  priceNote: "price may be paid in laughs, good company, and letting me pick the playlist."
};

/* ---------------- state ---------------- */
const state = { i: 0, done: false, where: null, detail: null, date: "", time: "", food: null, after: [], note: "", noDodges: 0, nameTries: 0 };
const $ = (s, el = document) => el.querySelector(s);
const card = $("#card");
const pad = n => String(n).padStart(2, "0");

function nextFriday() {
  const d = new Date(); d.setHours(12);
  do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 5);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
state.date = CONFIG.defaultDate || nextFriday();

function parseDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function prettyDate(iso) { return parseDate(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
function timeLabel(t) { return /whenever/i.test(t) || !t ? CONFIG.defaultTime : t; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function isStayIn() { return !!(state.detail && /uber eats/i.test(state.detail[1])); }
function isCook() { return !!(state.detail && /cook/i.test(state.detail[1])); }
function planText() {
  const w = state.where ? state.where[1] : "";
  if (!state.where || state.where[2] === "surprise") return w || "Surprise me";
  if (state.where[2] === "home") return state.detail ? state.detail[1] : w;
  return state.detail ? `${w} (${state.detail[1]})` : w;
}
function pickupLabel() {
  const t = startDateTime(); t.setMinutes(t.getMinutes() - CONFIG.pickupLeadMinutes);
  const h = t.getHours() % 12 || 12, m = t.getMinutes();
  return `${h}${m ? ":" + pad(m) : ""}${t.getHours() < 12 ? " AM" : " PM"}`;
}
function afterText() { return state.after.map(a => a[1]).join(", "); }

/* The flow adapts to her answers: "Surprise me" skips the follow-up question. */
function steps() {
  const s = ["ask", "where"];
  if (!state.where || state.where[2] !== "surprise") s.push("detail");
  s.push("when", "food", "after", "note", "glad", "agree");
  return s;
}
function show() {
  const list = steps();
  const n = state.done ? list.length : state.i + 1;
  $("#count").textContent = state.done ? "\u2713" : n + " / " + list.length;
  $("#progress").style.width = (n / list.length * 100) + "%";
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  render();
}
function next() { state.i++; show(); }

/* ---------------- screens ---------------- */
function render() {
  if (state.done) return done();
  const id = steps()[state.i];
  if (id === "ask") {
    card.innerHTML = `
      <div class="eyebrow">&#9829; A very important question</div>
      <h1>Will you go on a date with me, <select class="namepick" id="nm" aria-label="Name">${
        CONFIG.names.map(n => `<option ${n === CONFIG.herName ? "selected" : ""}>${esc(n)}</option>`).join("")
      }</select>?</h1>
      <p class="sub">Be honest. There is a right answer, obviously.</p>
      <div class="ask-zone" id="zone">
        <button class="btn yes" id="yes">YES &#10024;</button>
        <button class="btn ghost no" id="no">NO</button>
      </div>
      <div class="tiny" id="shy">psst... the NO button is a little shy</div>`;
    $("#yes").onclick = () => { burst(); next(); };
    setupName();
    setupNo();
  } else if (id === "where") {
    card.innerHTML = `
      <div class="eyebrow">&#10024; Excellent choice</div>
      <h1>Where are we doing this?</h1>
      <p class="sub">Out on the town or couch mode.</p>
      <div class="grid2" id="opts"></div>
      <button class="btn" id="go" disabled>next &rarr;</button>`;
    buildChips(CONFIG.places, "where", false, () => { state.detail = null; });
    $("#go").onclick = next;
    syncGo("where");
  } else if (id === "detail") {
    const home = state.where && state.where[2] === "home";
    card.innerHTML = `
      <div class="eyebrow">&#10022; ${home ? "Couch mode" : "Details"}</div>
      <h1>${home ? "What's the move?" : "What's the dress code?"}</h1>
      <p class="sub">${home ? "Two very good options." : "So I know how hard to impress you."}</p>
      <div class="grid2" id="opts"></div>
      <button class="btn" id="go" disabled>next &rarr;</button>`;
    buildChips(home ? CONFIG.homePlans : CONFIG.dress, "detail");
    $("#go").onclick = next;
    syncGo("detail");
  } else if (id === "when") {
    card.innerHTML = `
      <div class="eyebrow">&#128197; Save the moment</div>
      <h1>So... when are you free?</h1>
      <p class="sub">Pick a day and a time that feels cute.</p>
      <div class="field"><label for="d">Date</label><input id="d" type="date" value="${esc(state.date)}"></div>
      <div class="field"><label for="t">Time</label>
        <select id="t"><option value="">choose a time</option>
          ${CONFIG.times.map(t => `<option ${t === state.time ? "selected" : ""}>${esc(t)}</option>`).join("")}
        </select></div>
      <button class="btn" id="go" disabled style="margin-top:10px">lock it in &rarr;</button>`;
    const go = $("#go");
    const check = () => { state.date = $("#d").value; state.time = $("#t").value; go.disabled = !(state.date && state.time); };
    $("#d").onchange = check; $("#t").onchange = check; check();
    go.onclick = next;
  } else if (id === "food") {
    card.innerHTML = `
      <div class="eyebrow">&#10022; Date night research</div>
      <h1>${isCook() ? "What's on the menu?" : "What are we feeling?"} &#127869;&#10024;</h1>
      <p class="sub">${isStayIn() ? "pick your order" : isCook() ? "pick what we're cooking" : "pick your vibe"}</p>
      <div class="grid2" id="opts"></div>
      <button class="btn" id="go" disabled>this is the vibe &rarr;</button>`;
    buildChips(CONFIG.foods, "food");
    $("#go").onclick = () => { burst(); next(); };
    syncGo("food");
  } else if (id === "after") {
    card.innerHTML = `
      <div class="eyebrow">&#127769; Plan B, C and D</div>
      <h1>And what about after?</h1>
      <p class="sub">pick as many as you want</p>
      <div class="grid2" id="opts"></div>
      <button class="btn" id="go" disabled>next &rarr;</button>`;
    buildChips(CONFIG.afters, "after", true);
    $("#go").onclick = next;
    syncGo("after");
  } else if (id === "note") {
    card.innerHTML = `
      <div class="eyebrow">&#128221; Totally optional</div>
      <h1>Anything I should know?</h1>
      <p class="sub">Cravings, activities, a show you want to watch. Or skip.</p>
      <div class="field"><label for="n" class="sr">Note</label>
        <textarea id="n" rows="4" maxlength="300" placeholder="ex: I want something spicy and we have to watch that new show">${esc(state.note)}</textarea></div>
      <button class="btn" id="go">${state.note.trim() ? "all set" : "skip"} &rarr;</button>`;
    const n = $("#n"), go = $("#go");
    n.oninput = () => { state.note = n.value; go.innerHTML = (n.value.trim() ? "all set" : "skip") + " &rarr;"; };
    go.onclick = next;
  } else if (id === "glad") {
    const msg = isStayIn()
      ? `glad you didn't say no. Uber Eats is on me, I'm coming over at ${esc(pickupLabel())} &#128715;&#65039;`
      : isCook()
        ? `glad you didn't say no. I'm cooking, come over at ${esc(pickupLabel())} and bring your appetite &#127859;`
        : `glad you didn't say no. be ready by ${esc(pickupLabel())}, I'm coming to get you &#128663;`;
    card.innerHTML = `
      <div style="font-size:64px;line-height:1;margin-bottom:18px">&#128155;</div>
      <h1>${msg}</h1>
      <p class="sub" style="font-size:12px;max-width:380px">${esc(CONFIG.psText)}</p>
      <button class="btn" id="go">one tiny detail &rarr;</button>`;
    $("#go").onclick = next;
  } else if (id === "agree") {
    const food = state.food ? state.food[1] : "Surprise";
    const emoji = state.food ? state.food[0] : "\u{1F37D}\uFE0F";
    card.innerHTML = `
      <div class="paper">
        <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 2.8 4.5 6.4 4.5c2 0 3.6 1 4.6 2.6l1 1.4 1-1.4c1-1.6 2.6-2.6 4.6-2.6 3.6 0 5.5 3.7 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
        <div class="tag">SWOON</div>
        <h2>Date Agreement<sup>TM</sup></h2>
        <div class="joke">Officially very real paperwork</div>
        <div class="line"><span>Date Agreement<sup style="font-size:.6em">TM</sup></span><b>${esc(CONFIG.price)}</b></div>
        <div class="fine">one-time fee &middot; non-refundable &middot; absolutely worth it</div>
        <div class="slot"><span>${esc(prettyDate(state.date))} &middot; ${esc(timeLabel(state.time))}</span><span>${emoji} ${esc(food)}</span></div>
        <div class="slot" style="margin-top:8px"><span>${esc(planText())}</span>${state.after.length ? `<span>+ ${esc(afterText())}</span>` : ""}</div>
        <div class="footnote">${esc(CONFIG.priceNote)}</div>
      </div>
      <button class="btn" id="pay">Pay &amp; Confirm &#9829;</button>`;
    $("#pay").onclick = pay;
  }
}

/* single or multi select chips. onPick runs when a different single choice is made. */
function buildChips(list, key, multi, onPick) {
  const box = $("#opts");
  const isOn = label => multi ? state[key].some(x => x[1] === label) : !!(state[key] && state[key][1] === label);
  list.forEach(item => {
    const b = document.createElement("button");
    b.className = "chip" + (isOn(item[1]) ? " on" : "");
    b.innerHTML = `<span>${item[0]}</span><span>${esc(item[1])}</span>`;
    b.onclick = () => {
      if (multi) {
        const at = state[key].findIndex(x => x[1] === item[1]);
        if (at >= 0) state[key].splice(at, 1); else state[key].push(item);
        b.classList.toggle("on", at < 0);
      } else {
        if (!state[key] || state[key][1] !== item[1]) { state[key] = item; if (onPick) onPick(); }
        box.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
        b.classList.add("on");
      }
      syncGo(key);
    };
    box.appendChild(b);
  });
}
function syncGo(key) {
  const v = state[key];
  $("#go").disabled = Array.isArray(v) ? v.length === 0 : !v;
}

/* ---------------- the name gag ---------------- */
function setupName() {
  const sel = $("#nm"), shy = $("#shy");
  const lines = ["nice try. it's still " + CONFIG.herName + ".", "there is only one correct answer here", "I admire the persistence. it's " + CONFIG.herName + "."];
  sel.onchange = () => {
    if (sel.value === CONFIG.herName) return;
    shy.textContent = lines[Math.min(state.nameTries++, lines.length - 1)];
    setTimeout(() => { sel.value = CONFIG.herName; }, 900);
  };
}

/* ---------------- the shy NO button ---------------- */
function setupNo() {
  const no = $("#no"), zone = $("#zone"), shy = $("#shy");
  const lines = ["psst... the NO button is a little shy", "it really doesn't want to be clicked", "still shy", "just say yes already \u{1F97A}", "it's getting smaller", "it moved again, huh", "almost out of energy", "okay fine, you can click it"];
  let tamed = false, won = false;
  const tame = () => {
    tamed = true;
    no.textContent = "okay fine, you can click me";
    no.style.transform = "scale(.8)";
    shy.textContent = lines[lines.length - 1];
  };
  const dodge = e => {
    if (tamed) return;
    if (e) e.preventDefault();
    const n = ++state.noDodges;
    if (n >= 8) return tame();
    const zr = zone.getBoundingClientRect(), br = no.getBoundingClientRect();
    const maxX = Math.max(0, zr.width - br.width), maxY = Math.max(0, zr.height - br.height);
    no.style.right = "auto";
    no.style.left = Math.random() * maxX + "px";
    no.style.top = Math.random() * maxY + "px";
    no.style.transform = `scale(${Math.max(.6, 1 - n * .05)})`;
    shy.textContent = lines[Math.min(n, lines.length - 2)];
  };
  no.addEventListener("pointerenter", dodge);
  no.addEventListener("touchstart", dodge, { passive: false });
  no.addEventListener("click", e => {
    if (!tamed) return dodge(e);
    if (won) return;
    won = true;
    no.textContent = "YES \u2728";
    no.className = "btn yes";
    shy.textContent = "plot twist: that was a YES button all along";
    burst();
    setTimeout(next, 1300);
  });
}

/* ---------------- calendar ---------------- */
function startDateTime() {
  const [y, m, d] = state.date.split("-").map(Number);
  let h = 19, min = 0;
  const mt = /^(\d+):(\d+)\s*(AM|PM)/i.exec(timeLabel(state.time));
  if (mt) { h = (+mt[1]) % 12 + (/pm/i.test(mt[3]) ? 12 : 0); min = +mt[2]; }
  return new Date(y, m - 1, d, h, min);
}
function fmtLocal(dt) { return `${dt.getFullYear()}${pad(dt.getMonth() + 1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`; }
function eventTitle() { return `Date night with ${CONFIG.yourName} \u{1F49B}`; }
function eventDetails() {
  const bits = [`Plan: ${planText()}`];
  if (state.food) bits.push(`Food: ${state.food[1]}`);
  if (state.after.length) bits.push(`After: ${afterText()}`);
  if (state.note.trim()) bits.push(`Notes: ${state.note.trim()}`);
  bits.push(`Pickup around ${pickupLabel()}.`);
  return bits.join("\n");
}
function icsEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function buildIcs() {
  const start = startDateTime(), end = new Date(start.getTime() + 3 * 3600 * 1000);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Swoon//Date Night//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:swoon-${fmtLocal(start)}@thejacobbarney.github.io`,
    `DTSTAMP:${stamp}`,
    `DTSTART:${fmtLocal(start)}`,
    `DTEND:${fmtLocal(end)}`,
    `SUMMARY:${icsEsc(eventTitle())}`,
    `DESCRIPTION:${icsEsc(eventDetails())}`,
    "BEGIN:VALARM", "TRIGGER:-PT1H", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(eventTitle())}`, "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
}
function downloadIcs() {
  const url = URL.createObjectURL(new Blob([buildIcs()], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = "date-night.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function googleCalUrl() {
  const start = startDateTime(), end = new Date(start.getTime() + 3 * 3600 * 1000);
  const q = new URLSearchParams({ action: "TEMPLATE", text: eventTitle(), dates: `${fmtLocal(start)}/${fmtLocal(end)}`, details: eventDetails() });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

/* ---------------- pay and confirm ---------------- */
function summary() {
  return {
    from: CONFIG.yourName,
    to: CONFIG.herName,
    answer: "YES",
    plan: planText(),
    date: prettyDate(state.date),
    time: timeLabel(state.time),
    food: state.food ? state.food[1] : "",
    after: afterText(),
    note: state.note.trim(),
    noButtonDodges: state.noDodges,
    nameChangeAttempts: state.nameTries,
    submittedAt: new Date().toLocaleString()
  };
}
function smsText(o) {
  return `YES! Paid in laughs. ${o.date} at ${o.time}, ${o.food}. Plan: ${o.plan}.${o.after ? " After: " + o.after + "." : ""}${o.note ? " Note: " + o.note : ""} (${o.noButtonDodges} NO button attempts)`;
}

async function pay() {
  const btn = $("#pay"); btn.disabled = true; btn.textContent = "Processing...";
  const data = summary();
  state.sent = null;
  if (CONFIG.formEndpoint) {
    try {
      const r = await fetch(CONFIG.formEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ ...data, _subject: "Swoon: " + CONFIG.herName + " said YES" })
      });
      state.sent = r.ok;
    } catch (e) { state.sent = false; }
  }
  await new Promise(r => setTimeout(r, 700));
  burst(); burst();
  state.done = true; show();
}

function done() {
  const o = summary();
  const sms = CONFIG.yourPhone ? `sms:${CONFIG.yourPhone}?&body=${encodeURIComponent(smsText(o))}` : "";
  let status = "";
  if (state.sent === true) status = "Your date has been notified. Pretty smooth.";
  else if (state.sent === false) status = "Couldn't reach the server, so tap the button below to text it instead.";
  card.innerHTML = `
    <div style="font-size:54px;line-height:1;margin-bottom:12px">&#127881;</div>
    <h1>Payment accepted.</h1>
    <p class="sub">Receipt, for your records:</p>
    <div class="receipt">
      <div><span>Plan</span><span>${esc(o.plan)}</span></div>
      <div><span>Date</span><span>${esc(o.date)}</span></div>
      <div><span>Time</span><span>${esc(o.time)}</span></div>
      <div><span>Food</span><span>${esc(o.food)}</span></div>
      ${o.after ? `<div><span>After</span><span>${esc(o.after)}</span></div>` : ""}
      ${o.note ? `<div><span>Note</span><span>${esc(o.note)}</span></div>` : ""}
      <hr>
      <div><span>Paid in</span><span>laughs</span></div>
      <div><span>Playlist</span><span>mine</span></div>
    </div>
    <div class="btns">
      <button class="btn" id="ics">add to calendar &#128197;</button>
      <a class="btn ghost" id="gcal" target="_blank" rel="noopener" href="${esc(googleCalUrl())}">Google Calendar</a>
    </div>
    ${sms ? `<a class="link" style="display:inline-block;margin-top:14px" href="${sms}">or text ${esc(CONFIG.yourName)} the receipt</a>` : ""}
    <div class="status">${esc(status)}</div>
    <div class="tiny">see you at ${esc(pickupLabel())} ${isStayIn() ? "&#128715;&#65039;" : isCook() ? "&#127859;" : "&#128663;"}</div>`;
  $("#ics").onclick = downloadIcs;
}

/* ---------------- confetti ---------------- */
const cv = $("#confetti"), cx = cv.getContext("2d");
let bits = [], raf = null;
function fit() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", fit); fit();
function burst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#d4a82b", "#e6b422", "#f7d774", "#fff3b0", "#ffffff"];
  for (let i = 0; i < 90; i++) {
    bits.push({ x: cv.width / 2, y: cv.height * .55, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio,
      s: (Math.random() * 7 + 4) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 1 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(b => {
    b.vy += .5 * devicePixelRatio; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .008;
    cx.save(); cx.globalAlpha = Math.max(b.life, 0); cx.translate(b.x, b.y); cx.rotate(b.r);
    cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore();
  });
  bits = bits.filter(b => b.life > 0 && b.y < cv.height + 50);
  raf = bits.length ? requestAnimationFrame(tick) : null;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}

show();
</script>
