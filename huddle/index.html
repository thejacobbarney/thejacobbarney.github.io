<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Huddle — Fantasy Lineup Co-Pilot</title>
<meta name="description" content="Your ESPN Fantasy Football roster, start/sit calls, matchup, and standings, built for checking on your phone." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <header class="site-header">

        <button type="button" id="refresh-btn" class="icon-btn" title="Refresh" hidden>⟳</button>
